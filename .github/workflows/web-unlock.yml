name: web-unlock

# E2E coverage for the web-unlock skill: SQLite registry, repair flow,
# signal lifecycle, and (on demand) the real stealth-regression cycle.
#
# Stage 1 runs on every push to main and every PR touching the
# web-stack crate or the skill — fast (~30s including build cache),
# no network beyond crate fetches, no patchright/chromium install.
#
# Stage 2 (real stealth regression with patchright + chromium) is
# heavy and brittle. It runs only on manual workflow_dispatch with
# stage=stage2 or stage=full.

on:
  push:
    branches: [main]
    paths:
      - 'src/tools/web-stack/**'
      - 'src/skills/system/communication/web-unlock/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/web_stack_source.py'
      - 'scripts/test_web_stack_source.py'
      - 'scripts/web_stack_mutation.py'
      - 'scripts/test_web_stack_mutation.py'
      - '.github/workflows/web-unlock.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/tools/web-stack/**'
      - 'src/skills/system/communication/web-unlock/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/web_stack_source.py'
      - 'scripts/test_web_stack_source.py'
      - 'scripts/web_stack_mutation.py'
      - 'scripts/test_web_stack_mutation.py'
      - '.github/workflows/web-unlock.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Which stage(s) to run'
        required: false
        default: 'stage1'
        type: choice
        options:
          - stage1
          - stage2
          - full

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"
  CARGO_TARGET_DIR: target

concurrency:
  group: web-unlock-${{ github.event.pull_request.number || github.ref }}
  # A new push supersedes a PR head; main keeps its running build and only the newest pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-stage1:
    runs-on: ubuntu-22.04
    name: Stage 1 — synthetic regression lifecycle
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'workflow_dispatch' || github.event.inputs.stage != 'stage2') }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/build-pi-sidecar

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: web-unlock-stage1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev \
            jq sqlite3

      - name: Test web-stack source binding
        run: python3 -m unittest discover -s scripts -p 'test_web_stack*.py'

      - name: Build ctox
        run: python3 scripts/web_stack_source.py daemon-build

      - name: Unlock unit tests
        run: "python3 scripts/web_stack_source.py test -- --lib unlock:: --quiet -- --test-threads=2"

      - name: Stage 1 E2E
        run: src/tools/web-stack/scripts/test_web_unlock_e2e.sh --stage1

  e2e-stage2:
    runs-on: ubuntu-22.04
    name: Stage 2 — real stealth regression
    if: ${{ !github.event.pull_request.draft && (github.event_name == 'workflow_dispatch' && (github.event.inputs.stage == 'stage2' || github.event.inputs.stage == 'full')) }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/build-pi-sidecar

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.93.0"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: web-unlock-stage2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev \
            jq sqlite3

      - name: Test web-stack source binding
        run: python3 -m unittest discover -s scripts -p 'test_web_stack*.py'

      - name: Stage 2 E2E
        # Owns isolated canonical source, daemon builds and browser runtime.
        run: src/tools/web-stack/scripts/test_web_unlock_e2e.sh --stage2
