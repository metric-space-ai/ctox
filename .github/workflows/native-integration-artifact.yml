name: Native integration artifact

on:
  workflow_dispatch:
    inputs:
      focused_runtime:
        description: Execute only the 17 reviewed runtime regressions (not release acceptance)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/native-integration-artifact.yml
      - src/scripts/native-integration-artifact.py
      - src/scripts/native-integration-package-recovery.py

permissions:
  contents: read
  actions: read

concurrency:
  group: native-integration-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      RAYON_NUM_THREADS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      # Reviewed native integration plus required Desktop restart recovery.
      REVIEWED_SOURCE_REVISION: 'a0e30a8f8fd5012005cab9687ce25c1da7e60f85'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select verification mode before heavy work
        id: verification-mode
        run: python3 src/scripts/native-integration-package-recovery.py --select-mode
      - uses: ./.github/actions/build-pi-sidecar
        if: steps.verification-mode.outputs.mode != 'published'
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        if: steps.verification-mode.outputs.mode != 'published'
        with:
          toolchain: '1.93.0'
          targets: x86_64-unknown-linux-gnu
      - name: Resolve Cargo output directory
        if: steps.verification-mode.outputs.mode != 'published'
        id: cargo-layout
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1'
          ], text=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('target_relative_path=' + os.path.relpath(metadata['target_directory'], os.getcwd()) + '\n')
          PY
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        if: steps.verification-mode.outputs.mode != 'published'
        with:
          key: native-integration-linux-x64-release-metadata-v2
          workspaces: . -> ${{ steps.cargo-layout.outputs.target_relative_path }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install native dependencies
        if: steps.verification-mode.outputs.mode != 'published'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev libcap-dev libpcap-dev ripgrep
      - name: Verify reviewed source, test, and package
        if: steps.verification-mode.outputs.mode == 'full'
        timeout-minutes: 85
        env:
          FOCUSED_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.focused_runtime || false }}
        run: |
          args=()
          if [[ "$FOCUSED_RUNTIME" == "true" ]]; then args+=(--focused-runtime); fi
          python3 src/scripts/native-integration-artifact.py "${args[@]}"
      - name: Download pinned completed verification evidence
        if: steps.verification-mode.outputs.mode == 'recovery'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/metric-space-ai/ctox/actions/artifacts/10619043024/zip > "$RUNNER_TEMP/prior-native-evidence.zip"
      - name: Recover verified runtime package
        if: steps.verification-mode.outputs.mode == 'recovery'
        timeout-minutes: 65
        run: python3 src/scripts/native-integration-package-recovery.py
      - name: Verify immutable published package reuse
        if: steps.verification-mode.outputs.mode == 'published'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/metric-space-ai/ctox/actions/artifacts/10620560709/zip > "$RUNNER_TEMP/published-native-evidence.zip"
          python3 src/scripts/native-integration-package-recovery.py --verify-published
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-integration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-integration/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified runtime candidate
        if: ${{ success() && steps.verification-mode.outputs.mode != 'published' && !(github.event_name == 'workflow_dispatch' && inputs.focused_runtime) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctox-linux-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-integration/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
