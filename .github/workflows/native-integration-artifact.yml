name: Native integration artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-integration-artifact.yml
      - src/scripts/native-integration-artifact.py

permissions:
  contents: read

concurrency:
  group: native-integration-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      RAYON_NUM_THREADS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      REVIEWED_SOURCE_REVISION: 99be929e67ad7314e37750bd182297c6c2f72b5b
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/build-pi-sidecar
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: native-integration-linux-x64-release
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev libcap-dev libpcap-dev
      - name: Verify reviewed source, test, and package
        timeout-minutes: 75
        run: python3 src/scripts/native-integration-artifact.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-integration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-integration/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified runtime candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctox-linux-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-integration/artifacts/
          if-no-files-found: error
          retention-days: 14
