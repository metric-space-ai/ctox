# SPDX-License-Identifier: MIT OR AGPL-3.0-only
name: Business OS Shell Release

on:
  push:
    tags:
      - "business-os-shell-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer shell version (without tag prefix)"
        required: true
        type: string
      source_commit:
        description: "Optional reviewed main commit; defaults to the workflow ref"
        required: false
        type: string

concurrency:
  group: business-os-shell-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-shell:
    name: Build and publish Business OS shell
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0

      - name: Verify main release source
        id: source
        shell: bash
        env:
          INPUT_SOURCE: ${{ inputs.source_commit }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if [[ -n "$INPUT_SOURCE" ]]; then
            [[ "$INPUT_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo "source_commit must be a full commit ID" >&2; exit 1; }
            [[ "$source_commit" == "$INPUT_SOURCE" ]] || { echo "Checked-out source differs from requested commit" >&2; exit 1; }
          fi
          # Release line per series (E37): 0.2.x (Shell v4) is cut from main, 0.1.x (V2) only from release/v2.
          # E37.1: a 0.2.x PRERELEASE (version with '-', channel beta/nightly) may also be cut from origin/v4/integration,
          # so M7 dress rehearsals get a signed V4 candidate before the main merge. Stable 0.2.x stays main-only.
          # Clients subscribe to the stable channel only (shell_update.rs CHANNEL_URL); a prerelease is staged by version.
          if [[ "$EVENT_NAME" == "push" ]]; then version="${REF_NAME#business-os-shell-v}"; else version="$INPUT_VERSION"; fi
          case "$version" in
            0.1.*) release_lines=(release/v2) ;;
            0.2.*-*) release_lines=(main v4/integration) ;;
            0.2.*) release_lines=(main) ;;
            *) echo "No release line for shell version $version (known series: 0.1.x = release/v2, 0.2.x = main, 0.2.x-pre also v4/integration)" >&2; exit 1 ;;
          esac
          on_line=""
          for line in "${release_lines[@]}"; do
            git merge-base --is-ancestor "$source_commit" "refs/remotes/origin/$line" && { on_line="$line"; break; }
          done
          [[ -n "$on_line" ]] \
            || { echo "Release source $source_commit is not on origin/{${release_lines[*]}} (required for shell $version)" >&2; exit 1; }
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Validate release identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { validateSemVer } from './src/apps/business-os/scripts/build-shell-artifact.mjs';

          const prefix = 'business-os-shell-v';
          const isTagRun = process.env.EVENT_NAME === 'push';
          const version = isTagRun
            ? String(process.env.REF_NAME || '').slice(prefix.length)
            : String(process.env.INPUT_VERSION || '');
          validateSemVer(version);
          if (isTagRun && process.env.REF_NAME !== `${prefix}${version}`) {
            throw new Error(`Tag must equal ${prefix}<version>; received ${process.env.REF_NAME}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nrelease_tag=${prefix}${version}\n`);
          const channel = !version.includes('-')
            ? 'stable'
            : version.includes('-nightly.')
              ? 'nightly'
              : 'beta';
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\n`);
          NODE

      - name: Guard immutable release version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /dev/null 2> "$error_file"; then
            echo "Release already exists; immutable assets must not be overwritten" >&2
            exit 1
          fi
          [[ "$(cat "$error_file")" == *"HTTP 404"* ]] || { cat "$error_file" >&2; exit 1; }

      - name: Install pinned browser test dependencies
        run: npm ci --prefix src/apps/business-os

      - name: Select release gate series
        id: series
        shell: bash
        env:
          SHELL_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          # Each release series runs its complete gate: 0.1.x ships the V2 shell, 0.2.x the Shell v4.
          # An unknown series fails here, so no gate step can be skipped silently.
          case "$SHELL_VERSION" in
            0.1.*) series=v2 ;;
            0.2.*) series=v4 ;;
            *) echo "No release gate for shell version $SHELL_VERSION (known series: 0.1.x = V2, 0.2.x = v4)" >&2; exit 1 ;;
          esac
          echo "series=$series" >> "$GITHUB_OUTPUT"

      - name: Guard CTOX harness rendering
        run: node src/apps/business-os/modules/ctox/test.js

      - name: Install pinned layout test browser
        working-directory: src/apps/business-os
        run: npx playwright install --with-deps chromium

      - name: Guard visible harness layout and loaded document identity
        run: node src/apps/business-os/modules/ctox/tests/layout.browser.mjs

      - name: Guard App-API stub pin (v4)
        if: steps.series.outputs.series == 'v4'
        run: node --test src/apps/business-os/modules/ctox/tests/app-api-stub-pin.test.mjs

      - name: Run Office editor and sync regressions
        if: steps.series.outputs.series == 'v2'
        run: >-
          node --test
          src/apps/business-os/office-engine/office-engine.test.mjs
          src/apps/business-os/office-engine/office-commit-upload.test.mjs
          src/apps/business-os/office-engine/office-source-upload.test.mjs
          src/apps/business-os/office-engine/save-lifecycle.test.mjs
          src/apps/business-os/office-engine/version-recovery-races.test.mjs
          src/apps/business-os/modules/documents/documents.test.mjs
          src/apps/business-os/modules/spreadsheets/spreadsheets.test.mjs
      - name: Run Office editor and sync regressions (v4)
        if: steps.series.outputs.series == 'v4'
        run: >-
          node --test
          src/apps/business-os/office-engine/office-engine.test.mjs
          src/apps/business-os/office-engine/office-commit-upload.test.mjs
          src/apps/business-os/office-engine/office-source-upload.v4.test.mjs
          src/apps/business-os/office-engine/save-lifecycle.test.mjs
          src/apps/business-os/office-engine/version-recovery-races.v4.test.mjs
          src/apps/business-os/modules/documents/documents.test.mjs
          src/apps/business-os/modules/spreadsheets/spreadsheets.test.mjs

      - name: Guard mobile Office editor height
        if: steps.series.outputs.series == 'v2'
        run: npm --prefix src/apps/business-os run qa:shell-office-height -- --output-dir "${RUNNER_TEMP}/ctox-shell-office-height"
      - name: Guard mobile Office editor height (v4)
        if: steps.series.outputs.series == 'v4'
        run: npm --prefix src/apps/business-os run qa:shell-office-height:v4 -- --output-dir "${RUNNER_TEMP}/ctox-shell-office-height"
      - name: Guard Office notification contract
        if: steps.series.outputs.series == 'v2'
        run: npm --prefix src/apps/business-os run qa:office-notifications -- --output-dir "${RUNNER_TEMP}/ctox-office-notifications"
      - name: Guard Office notification contract (v4)
        if: steps.series.outputs.series == 'v4'
        run: npm --prefix src/apps/business-os run qa:office-notifications:v4 -- --output-dir "${RUNNER_TEMP}/ctox-office-notifications"

      - name: Run focused shell artifact tests
        run: npm run test:shell-artifact --prefix src/apps/business-os

      - name: Enforce Workjet product identity
        run: |
          node src/apps/business-os/scripts/assert-customer-app-isolation.mjs "$GITHUB_WORKSPACE"
          node src/apps/business-os/scripts/assert-workjet-branding.mjs
          node src/apps/business-os/scripts/assert-shell-release-chrome.mjs
          node src/apps/business-os/scripts/audit-business-os-content.mjs

      - name: Build shell artifact
        env:
          SHELL_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          npm run shell:artifact --prefix src/apps/business-os -- \
            --source-root "$GITHUB_WORKSPACE/src/apps/business-os" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/business-os-shell" \
            --version "$SHELL_VERSION" \
            --source-commit "${{ steps.source.outputs.commit }}"

      - name: Verify detached SHA-256
        working-directory: artifacts/business-os-shell
        env:
          SHELL_VERSION: ${{ steps.identity.outputs.version }}
        run: sha256sum -c "ctox-business-os-shell-${SHELL_VERSION}.tar.gz.sha256"

      - name: Build SPDX SBOM
        env:
          SHELL_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          npm run shell:sbom --prefix src/apps/business-os -- \
            --manifest "$GITHUB_WORKSPACE/artifacts/business-os-shell/ctox-business-os-shell-${SHELL_VERSION}.manifest.json" \
            --output "$GITHUB_WORKSPACE/artifacts/business-os-shell/ctox-business-os-shell-${SHELL_VERSION}.spdx.json" \
            --namespace "https://github.com/${{ github.repository }}/releases/download/${{ steps.identity.outputs.release_tag }}/ctox-business-os-shell-${SHELL_VERSION}.spdx.json"

      - name: Sign release manifest and channel pointer
        env:
          SHELL_VERSION: ${{ steps.identity.outputs.version }}
          SHELL_CHANNEL: ${{ steps.identity.outputs.channel }}
          SHELL_SIGNING_KEY_ID: ${{ vars.CTOX_BUSINESS_OS_SHELL_SIGNING_KEY_ID }}
          SHELL_SIGNING_KEY: ${{ secrets.CTOX_BUSINESS_OS_SHELL_SIGNING_KEY_PKCS8_BASE64 }}
        run: |
          test -n "$SHELL_SIGNING_KEY_ID"
          test -n "$SHELL_SIGNING_KEY"
          published_at="$(git show -s --format=%cI '${{ steps.source.outputs.commit }}')"
          base_url="https://github.com/${{ github.repository }}/releases/download/${{ steps.identity.outputs.release_tag }}"
          npm run shell:sign-release --prefix src/apps/business-os -- \
            --manifest "$GITHUB_WORKSPACE/artifacts/business-os-shell/ctox-business-os-shell-${SHELL_VERSION}.manifest.json" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/business-os-shell/signed" \
            --channel "$SHELL_CHANNEL" \
            --published-at "$published_at" \
            --artifact-url "$base_url/ctox-business-os-shell-${SHELL_VERSION}.tar.gz" \
            --manifest-url "$base_url/ctox-business-os-shell-${SHELL_VERSION}.release.v2.json" \
            --sbom-url "$base_url/ctox-business-os-shell-${SHELL_VERSION}.spdx.json" \
            --signing-key-id "$SHELL_SIGNING_KEY_ID" \
            --private-key-base64 "$SHELL_SIGNING_KEY" \
            --workjet-min "0.0.33" \
            --ctox-min "0.3.22"

      - name: Upload shell release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctox-business-os-shell-${{ steps.identity.outputs.version }}
          if-no-files-found: error
          path: |
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.tar.gz
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.manifest.json
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.tar.gz.sha256
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.spdx.json
            artifacts/business-os-shell/signed/ctox-business-os-shell-${{ steps.identity.outputs.version }}.release.v2.json
            artifacts/business-os-shell/signed/business-os-shell-${{ steps.identity.outputs.channel }}.json

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.identity.outputs.release_tag }}
          target_commitish: ${{ steps.source.outputs.commit }}
          name: CTOX Business OS Shell ${{ steps.identity.outputs.version }}
          prerelease: ${{ contains(steps.identity.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.tar.gz
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.manifest.json
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.tar.gz.sha256
            artifacts/business-os-shell/ctox-business-os-shell-${{ steps.identity.outputs.version }}.spdx.json
            artifacts/business-os-shell/signed/ctox-business-os-shell-${{ steps.identity.outputs.version }}.release.v2.json

      - name: Publish signed channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHELL_CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          channel_tag="business-os-shell-channel-${SHELL_CHANNEL}"
          gh release view "$channel_tag" >/dev/null 2>&1 || \
            gh release create "$channel_tag" --title "Business OS Shell ${SHELL_CHANNEL} channel" --notes "Signed mutable channel pointer. Release artifacts remain immutable."
          gh release upload "$channel_tag" \
            "artifacts/business-os-shell/signed/business-os-shell-${SHELL_CHANNEL}.json" \
            --clobber
