name: Harness persistent resume

on:
  pull_request:
    paths:
      - "src/core/harness/**"
      - ".github/workflows/harness-persistent-resume.yml"
  push:
    branches: [main]
    paths:
      - "src/core/harness/**"
      - ".github/workflows/harness-persistent-resume.yml"

permissions:
  contents: read

jobs:
  persistent-resume:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      RUST_TEST_THREADS: "2"
      CARGO_TERM_COLOR: never
    steps:
      - name: Prepare disposable directories
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/ctox-persistent-resume"
          mkdir -p "$task_root/target" "$task_root/cargo-home" "$task_root/tmp"
          {
            echo "CARGO_TARGET_DIR=$task_root/target"
            echo "CARGO_HOME=$task_root/cargo-home"
            echo "TMPDIR=$task_root/tmp"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.93.0"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev sqlite3
      - name: Verify rollout writer materialization and failure contracts
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          cargo_args=(--locked --manifest-path src/core/harness/Cargo.toml -p ctox-core --lib --jobs 2)
          for test_name in \
            rollout::recorder::tests::recorder_flush_propagates_writer_failure \
            rollout::recorder::tests::recorder_materializes_only_after_explicit_persist \
            rollout::recorder::tests::concurrent_reader_never_sees_partially_materialized_rollout \
            rollout::recorder::tests::owned_preparation_files_are_unique_and_leave_stale_files_alone \
            rollout::recorder::tests::state_visibility_waits_until_public_rollout_publication \
            rollout::recorder::tests::cancelled_persist_caller_does_not_leave_recorder_pending \
            rollout::recorder::tests::failed_creation_preserves_exact_staging_path \
            rollout::recorder::tests::final_path_collision_preserves_owner_and_cleans_own_staging; do
            cargo test "${cargo_args[@]}" "$test_name" -- --exact --test-threads=2 | tee "$TMPDIR/flush-test-result.txt"
            python3 - "$TMPDIR/flush-test-result.txt" <<'PYCODE'
          import pathlib, sys
          result = pathlib.Path(sys.argv[1]).read_text()
          assert "test result: ok. 1 passed; 0 failed; 0 ignored;" in result, result
          PYCODE
          done
      - name: Verify persisted rollout reader failure contract
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          test_name='codex_message_processor::tests::read_summary_from_rollout_fails_closed_when_persisted_rollout_is_invalid'
          cargo_args=(--locked --manifest-path src/core/harness/Cargo.toml -p ctox-app-server --lib --jobs 2)
          cargo test "${cargo_args[@]}" "$test_name" -- --exact --list | tee "$TMPDIR/reader-contract-list.txt"
          python3 - "$TMPDIR/reader-contract-list.txt" "$test_name" <<'PYCODE'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert lines.count(sys.argv[2] + ": test") == 1, lines
          PYCODE
          cargo test "${cargo_args[@]}" "$test_name" -- --exact --test-threads=2 | tee "$TMPDIR/reader-contract-result.txt"
          python3 - "$TMPDIR/reader-contract-result.txt" <<'PYCODE'
          import pathlib, sys
          result = pathlib.Path(sys.argv[1]).read_text()
          assert "test result: ok. 1 passed; 0 failed; 0 ignored;" in result, result
          PYCODE
      - name: Verify persistent restart and missing resume

        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          test_name='persistent_resume_tests::named_persistent_thread_survives_manager_restart_and_missing_resume_fails_closed'
          cargo_args=(--locked --manifest-path src/core/harness/Cargo.toml -p ctox-app-server-client --lib --jobs 2)
          cargo test "${cargo_args[@]}" "$test_name" -- --exact --list | tee "$TMPDIR/test-list.txt"
          python3 - "$TMPDIR/test-list.txt" "$test_name" <<'PYCODE'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert lines.count(sys.argv[2] + ": test") == 1, lines
          PYCODE
          cargo test "${cargo_args[@]}" "$test_name" -- --exact --test-threads=2 | tee "$TMPDIR/test-result.txt"
          python3 - "$TMPDIR/test-result.txt" <<'PYCODE'
          import pathlib, sys
          result = pathlib.Path(sys.argv[1]).read_text()
          assert "test result: ok. 1 passed; 0 failed; 0 ignored;" in result, result
          PYCODE
