name: RxDB frame liveness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/apps/business-os/rxdb/src/webrtc-native.mjs'
      - 'src/apps/business-os/rxdb/tests/hidden-transfer*'
      - '.github/workflows/rxdb-frame-liveness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/runtime/build/cargo-target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
          components: clippy, rustfmt
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: src/core/rxdb -> ../../../runtime/build/cargo-target
      - name: Native contract tests, Clippy and wire daemon
        run: |
          cargo fmt --check --manifest-path src/core/rxdb/Cargo.toml
          cargo test --locked --manifest-path src/core/rxdb/Cargo.toml -- --test-threads=1
          cargo clippy --locked --manifest-path src/core/rxdb/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --manifest-path src/core/rxdb/Cargo.toml --example v15_wire_daemon
      - name: Browser and cross-process wire tests
        run: |
          npm ci --ignore-scripts --prefix src/apps/business-os
          npm --prefix src/apps/business-os exec -- playwright install --with-deps chromium
          node src/apps/business-os/rxdb/tests/run-all.mjs --require-wire-daemon
          node src/apps/business-os/scripts/assert-shell-v2-contract.mjs
