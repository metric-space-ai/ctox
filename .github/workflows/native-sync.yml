name: Native Sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-sync.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/core/business_os/**'
      - 'src/core/mission/channels/**'
      - 'src/core/sync/**'
      - 'src/core/sync_host/**'
      - 'src/core/sync_host.rs'
      - 'src/core/rxdb/**'
      - 'src/apps/business-os/app.js'
      - 'src/apps/business-os/index.html'
      - 'src/apps/business-os/scripts/assert-business-chat-behavior.mjs'
      - 'src/apps/business-os/scripts/assert-shell-v2-contract.mjs'
      - 'src/apps/business-os/scripts/shell-v2-geometry-lab.mjs'
      - 'src/apps/business-os/rxdb/**'
      - 'src/apps/business-os/shared/**'
      - 'src/apps/business-os/package.json'
      - 'src/apps/business-os/package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-sync.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/core/business_os/**'
      - 'src/core/mission/channels/**'
      - 'src/core/sync/**'
      - 'src/core/sync_host/**'
      - 'src/core/sync_host.rs'
      - 'src/core/rxdb/**'
      - 'src/apps/business-os/app.js'
      - 'src/apps/business-os/index.html'
      - 'src/apps/business-os/scripts/assert-business-chat-behavior.mjs'
      - 'src/apps/business-os/scripts/assert-shell-v2-contract.mjs'
      - 'src/apps/business-os/scripts/shell-v2-geometry-lab.mjs'
      - 'src/apps/business-os/rxdb/**'
      - 'src/apps/business-os/shared/**'
      - 'src/apps/business-os/package.json'
      - 'src/apps/business-os/package-lock.json'

permissions:
  contents: read

jobs:
  native-sync:
    name: Native Sync (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ctox
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Configure disposable build storage
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          printf 'CARGO_TARGET_DIR=%s/ctox-native-sync-target\nTMPDIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/ctox-browser-chromium\nnpm_config_cache=%s/ctox-browser-npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: ctox
      - name: Checkout the actual Workjet IPC consumer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: metric-space-ai/workjet
          ref: 1a81eabec00fa262c36d72970376f2d09da6a48f
          path: workjet
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.13.1'
      - name: Install the pinned Workjet workspace dependencies
        working-directory: workjet
        run: npm exec --yes --package=pnpm@11.10.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: native-sync-production-transport
          workspaces: |
            ctox/src/core/sync -> ${{ runner.temp }}/ctox-native-sync-target
            ctox/src/core/rxdb -> ${{ runner.temp }}/ctox-native-sync-target
      - name: Require production transport versions and ICE patch
        run: node src/apps/business-os/rxdb/tests/native-transport-parity-smoke.mjs
      - name: Format
        id: format
        run: |
          cargo fmt --check --manifest-path src/core/sync/Cargo.toml
          cargo fmt --check --manifest-path src/core/rxdb/Cargo.toml
      - name: Verify generated Rust and Workjet contracts
        run: |
          node src/core/sync/tools/generate-contracts.mjs --check --workjet-root ../workjet
          node src/core/sync/tools/assert-host-contracts.mjs ../workjet
      - name: Native authority, lifecycle and real WebRTC scenarios
        run: cargo test --locked --no-fail-fast --manifest-path src/core/sync/Cargo.toml --features webrtc
      - name: Native RxDB tests with production ICE patch
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: cargo test --locked --manifest-path src/core/rxdb/Cargo.toml
      - name: Native Sync lint
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: cargo clippy --locked --manifest-path src/core/sync/Cargo.toml --features webrtc --all-targets -- -D warnings
      - name: Workjet native IPC framing and cancellation
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        working-directory: workjet/apps/server
        run: npm exec --yes --package=pnpm@11.10.0 -- pnpm exec vp test run src/workjet/sync/WorkjetSyncIpc.test.ts
      - name: Install the pinned Business OS browser test runtime
        id: browser-dependencies
        if: ${{ !cancelled() && matrix.os == 'ubuntu-22.04' && steps.format.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          npm --prefix src/apps/business-os ci
          npm --prefix src/apps/business-os exec playwright install --with-deps chromium
      - name: Build the native query and file wire fixture
        id: wire-fixture
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        run: |
          cargo build --locked --manifest-path src/core/rxdb/Cargo.toml --example v15_wire_daemon
          mkdir -p runtime/build "$RUNNER_TEMP/ctox-browser-proof"
          ln -s "$CARGO_TARGET_DIR" runtime/build/cargo-target
          git rev-parse HEAD > "$RUNNER_TEMP/ctox-browser-proof/source-revision.txt"
          sha256sum "$CARGO_TARGET_DIR/debug/examples/v15_wire_daemon" > "$RUNNER_TEMP/ctox-browser-proof/wire-daemon.sha256"
      - name: Complete JavaScript and browser contracts with native wire coverage
        if: ${{ !cancelled() && steps.wire-fixture.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          COMMAND_PLANE_BASELINE_PATH="$RUNNER_TEMP/ctox-browser-proof/command-plane-observability.json" \
            node src/apps/business-os/rxdb/tests/run-all.mjs --require-wire-daemon \
            | tee "$RUNNER_TEMP/ctox-browser-proof/suite.log"
      - name: Retain browser contract evidence
        if: ${{ !cancelled() && matrix.os == 'ubuntu-22.04' && steps.wire-fixture.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctox-native-browser-contract-proof
          path: ${{ runner.temp }}/ctox-browser-proof/
          if-no-files-found: error

  chat-presentation:
    name: Chat presentation (Chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Configure disposable browser evidence storage
        shell: bash
        run: |
          printf 'TMPDIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/ctox-chat-chromium\nnpm_config_cache=%s/ctox-chat-npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ctox-chat-proof"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.13.1'
      - name: Install the pinned browser runtime
        run: |
          npm --prefix src/apps/business-os ci
          npm --prefix src/apps/business-os exec playwright install --with-deps chromium
      - name: Record tested source
        run: git rev-parse HEAD > "$RUNNER_TEMP/ctox-chat-proof/source-revision.txt"
      - name: Shell geometry contract
        run: |
          node src/apps/business-os/scripts/assert-shell-v2-contract.mjs
          node src/apps/business-os/scripts/shell-v2-geometry-lab.mjs \
            --apps ctox --widths 1180,1000,720 \
            --output-dir "$RUNNER_TEMP/ctox-chat-proof/shell-geometry"
      - name: Chat interaction and delayed storage presentation
        if: ${{ !cancelled() }}
        run: |
          BUSINESS_CHAT_BEHAVIOR_OUTPUT_DIR="$RUNNER_TEMP/ctox-chat-proof/chat-behavior" \
            node src/apps/business-os/scripts/assert-business-chat-behavior.mjs
      - name: Retain browser presentation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctox-chat-presentation-proof
          path: ${{ runner.temp }}/ctox-chat-proof/
          if-no-files-found: error

  full-host-acceptance:
    name: Full CTOX host acceptance (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Configure disposable build and evidence storage
        shell: bash
        run: |
          printf 'CARGO_TARGET_DIR=%s/ctox-full-host-target\nTMPDIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/ctox-host-chromium\nnpm_config_cache=%s/ctox-host-npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ctox-host-proof" "$RUNNER_TEMP/ctox-host-fixtures"
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/build-pi-sidecar
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.13.1'
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
      - name: Install native host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev sqlite3
      - name: Install the pinned real-browser runtime
        run: |
          npm --prefix src/apps/business-os ci
          npm --prefix src/apps/business-os exec playwright install --with-deps chromium
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: full-ctox-host-dev-no-debug
          # Preserve compiled dependencies when a later acceptance gate fails.
          # The full source build and every assertion still run on each revision.
          cache-on-failure: true
          workspaces: |
            . -> ${{ runner.temp }}/ctox-full-host-target
            src/core/sync -> ${{ runner.temp }}/ctox-full-host-target
      - name: Build the complete CTOX binary from the checked-out source
        id: native-binary
        run: |
          cargo build --locked --bin ctox
          git rev-parse HEAD > "$RUNNER_TEMP/ctox-host-proof/source-revision.txt"
          sha256sum "$CARGO_TARGET_DIR/debug/ctox" > "$RUNNER_TEMP/ctox-host-proof/binary.sha256"
      - name: Four real host processes, recovery and control latency
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --manifest-path src/core/sync/Cargo.toml --features webrtc --example host_cli_acceptance -- \
            "$CARGO_TARGET_DIR/debug/ctox" "$RUNNER_TEMP/ctox-host-fixtures" \
            | tee "$RUNNER_TEMP/ctox-host-proof/acceptance.json"
      - name: Command completion and queue transaction regressions
        if: ${{ !cancelled() && steps.native-binary.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --bin ctox business_os::command_plane::tests -- --test-threads=2 \
            | tee "$RUNNER_TEMP/ctox-host-proof/command-completion-tests.log"
          cargo test --locked --bin ctox -- mission::channels::tests::business_command mission::channels::tests::business_control --test-threads=2 \
            | tee "$RUNNER_TEMP/ctox-host-proof/command-transaction-tests.log"
      - name: Context prompt first paint and authorized native command
        if: ${{ !cancelled() && steps.native-binary.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          CTOX_BIN="$CARGO_TARGET_DIR/debug/ctox" \
            SMOKE_MODE=business-os-threads-rightclick-ui SMOKE_PAGE_PATH=/index.html \
            BUSINESS_PORT=8879 SIGNALING_PORT=18878 \
            SMOKE_PROCESS_LIFECYCLE_PATH="$RUNNER_TEMP/ctox-host-proof/context-chat-processes.json" \
            node src/core/rxdb/tools/browser_rust_smoke.js \
            | tee "$RUNNER_TEMP/ctox-host-proof/context-chat-browser.log"
      - name: Measure warm Browser-WebRTC-CTOX command roundtrips
        if: ${{ !cancelled() && steps.native-binary.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          CTOX_BIN="$CARGO_TARGET_DIR/debug/ctox" \
            SMOKE_MODE=command-roundtrip-timing-browser-to-rust \
            SMOKE_PAGE_PATH=/index.html \
            SMOKE_COMMAND_TIMING_OUTPUT="$RUNNER_TEMP/ctox-host-proof/command-marks.json" \
            SMOKE_COMMAND_TIMING_REPORT_OUTPUT="$RUNNER_TEMP/ctox-host-proof/command-stages.json" \
            SMOKE_PROCESS_LIFECYCLE_PATH="$RUNNER_TEMP/ctox-host-proof/command-processes.json" \
            node src/core/rxdb/tools/browser_rust_smoke.js \
            | tee "$RUNNER_TEMP/ctox-host-proof/command-browser.log"
          node src/apps/business-os/rxdb/tests/command-roundtrip-budget.mjs \
            --input "$RUNNER_TEMP/ctox-host-proof/command-marks.json" \
            | tee "$RUNNER_TEMP/ctox-host-proof/command-budget.json"
      - name: Verify 21 collections across reload and native restart
        if: ${{ !cancelled() && steps.native-binary.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          CTOX_BIN="$CARGO_TARGET_DIR/debug/ctox" \
            SMOKE_MODE=multiplex-reload-browser-to-rust \
            SMOKE_PAGE_PATH=/index.html BUSINESS_PORT=8878 SIGNALING_PORT=18877 \
            SMOKE_PROCESS_LIFECYCLE_PATH="$RUNNER_TEMP/ctox-host-proof/reload-processes.json" \
            node src/core/rxdb/tools/browser_rust_smoke.js \
            | tee "$RUNNER_TEMP/ctox-host-proof/multiplex-reload.log"
      - name: Retain host proof and binary provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctox-native-full-host-proof
          path: ${{ runner.temp }}/ctox-host-proof/
          if-no-files-found: ignore
