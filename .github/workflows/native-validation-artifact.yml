name: Native validation artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-validation-artifact.yml
      - src/core/business_os/**
      - src/core/rxdb/**

permissions:
  contents: read

concurrency:
  group: native-validation-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Route compiler output to runner scratch storage
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/ctox-native-validation-target" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-pi-sidecar
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.93.0"
      - name: Build native validation binary
        run: cargo build --locked --bin ctox
      - name: Check binary and record provenance
        run: |
          mkdir -p "$RUNNER_TEMP/ctox-native-validation"
          cp "$CARGO_TARGET_DIR/debug/ctox" "$RUNNER_TEMP/ctox-native-validation/ctox"
          "$RUNNER_TEMP/ctox-native-validation/ctox" help
          git rev-parse HEAD > "$RUNNER_TEMP/ctox-native-validation/SOURCE_COMMIT"
          cd "$RUNNER_TEMP/ctox-native-validation"
          shasum -a 256 ctox > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ctox-native-validation-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/ctox-native-validation/
          retention-days: 7
          if-no-files-found: error
