[package]
name = "ctox"
version = "0.3.22"
edition = "2021"
license = "AGPL-3.0-only"
build = "src/build.rs"
exclude = [
    "archive/**",
    "runtime/**",
    "src/core/communication/whatsapp_rust/_upstream.backup/**",
    "src/core/inference/models/voxtral_mini_4b_realtime_2602/vendor/ggml/**",
]

[[bin]]
name = "ctox"
path = "src/core/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
ctox-doc-stack = { path = "src/tools/doc-stack" }
ctox-cliproxyapi = { path = "src/core/execution/cliproxyapi", default-features = false, features = ["anthropic-fingerprint-transport", "codex-http-transport", "antigravity-http-transport"] }
ctox-appsec-pentest = { path = "src/tools/appsec-pentest" }
ctox-pdf-parse = { path = "src/tools/pdf-parse" }
ctox-qwen3-embedding-0-6b = { path = "src/core/inference/models/qwen3_embedding_0_6b" }
ctox-voxtral-mini-4b-realtime-2602 = { path = "src/core/inference/models/voxtral_mini_4b_realtime_2602" }
ctox-voxtral-4b-tts-2603 = { path = "src/core/inference/models/voxtral_4b_tts_2603" }
ctox-web-stack = { git = "https://github.com/metric-space-ai/workjet", rev = "b80535e2d49f578e183abf891ff45db31f1dc483" }
ctox-sqlserver-adapter = { path = "src/tools/sqlserver-mcp" }
ctox-postgres-adapter = { path = "src/tools/postgres-adapter" }
rxdb = { package = "ctox-rxdb", path = "src/core/rxdb" }
ctox-sync = { path = "src/core/sync", features = ["webrtc"] }
ctox-mailserver = { path = "src/core/mailserver" }
crossterm = "0.28"
# Ohne Vorgabemerkmale: `https` bindet libgit2 gegen OpenSSL, und OpenSSL
# kollidiert auf Linux mit dem BoringSSL aus wreq. Die Wurzel benutzt git2 nur
# lokal (jami_native: Repository/Sort); die einzige Kiste mit Fernzugriff
# (cliproxyapi) deklariert git2 selbst schon ohne Vorgabemerkmale.
git2 = { version = "0.20", default-features = false }
include_dir = "0.7"
libc = "0.2"
mailparse = "0.16"
notify = "8.2"
polars = { version = "0.53.0", default-features = false, features = [
    "lazy",
    "dtype-full", "strings", "regex", "timezones",
    "is_in", "diagonal_concat", "concat_str",
    "fmt", "describe",
] }
polars-io = { version = "0.53.0", default-features = false, features = ["csv", "json", "parquet"] }
polars-lazy = { version = "0.53.0", default-features = false, features = ["csv", "json", "parquet"] }
polars-utils = { version = "0.53.0", default-features = false }
ratatui = "0.29"
regex = "1"
qrcode = "0.14"
quick-xml = "0.41"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
# IoT automation-widget trigger runtime (RFC 0011): Rust-native, sandboxed
# scripting for the CTOX-generated watcher. No FS/net; engine-level op/time limits.
# NOTE: rhai pulls `smartstring`, whose blanket `impl Add<SmartString> for String`
# disables the `String + &String` deref-coercion crate-wide. Concatenate with
# `s + other.as_str()` (not `s + &other`) anywhere in this crate.
rhai = { version = "1", features = ["serde"] }
ring = "0.17"
rustls-native-certs = "0.8"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
# `tls` ist ureqs rustls-Rueckwand; `native-tls` wuerde OpenSSL hereinziehen.
ureq = { version = "2.12", features = ["tls"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
zbus = "5.14"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# CTOX agent harness (OpenAI-Codex fork).
ctox-core                = { path = "src/core/harness/core" }
ctox-app-server-client   = { path = "src/core/harness/app-server-client" }
ctox-app-server-protocol = { path = "src/core/harness/app-server-protocol" }
ctox-protocol            = { path = "src/core/harness/protocol" }
ctox-arg0                = { path = "src/core/harness/arg0" }
ctox-feedback            = { path = "src/core/harness/feedback" }
ctox-cloud-requirements  = { path = "src/core/harness/cloud-requirements" }
ctox-utils-absolute-path = { path = "src/core/harness/utils/absolute-path" }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-tungstenite = { version = "0.28.0", features = [
    "proxy",
    "rustls-tls-native-roots",
] }
rustls = { version = "0.23", features = ["ring"] }
whatsapp = { path = "src/core/communication/whatsapp_rust/crates/whatsapp" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"

[workspace]
members = [
    "src/core/execution/cliproxyapi",
    "src/tools/postgres-adapter",
]
exclude = [
    "src/apps/desktop",
    "src/core/communication/whatsapp_rust",
    "src/core/harness",
    "src/core/inference/models/qwen3_embedding_0_6b",
    "src/core/inference/models/voxtral_4b_tts_2603",
    "src/core/inference/models/voxtral_mini_4b_realtime_2602",
    "src/core/mailserver",
    "src/core/rxdb",
    "src/core/sync",
    "src/tools/appsec-pentest",
    "src/tools/doc-stack",
    "src/tools/pdf-parse",
    "src/tools/sqlserver-mcp",
    "src/tools/web-stack",
]

[patch.crates-io]
# Mirror of src/core/harness/Cargo.toml patch.crates-io so that codex-* path
# dependencies resolve against the same forks agent-runtime uses.
crossterm = { git = "https://github.com/nornagon/crossterm", branch = "nornagon/color-query" }
ratatui = { git = "https://github.com/nornagon/ratatui", branch = "nornagon-v0.29.0-patch" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
rtc-ice = { path = "src/core/rxdb/patches/rtc-ice" }
# rama 0.3.0-alpha.4 still pins vulnerable hickory 0.25. Keep the alpha API
# while using the fixed hickory 0.26 resolver until the pinned Rust toolchain
# can consume rama 0.4.
rama-dns = { path = "src/core/harness/network-proxy/patches/rama-dns" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
