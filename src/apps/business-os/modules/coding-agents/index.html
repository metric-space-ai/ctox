<!-- Coding Agents (Shell v4, Strang AGENT): Übersicht aller Agent-Läufe. Der Agent selbst sitzt als Seitenleiste in der
     Code-Ansicht jeder App (Bedienkonzept §3); ein Klick auf einen Lauf öffnet die Code-Ansicht der App
     (api.shell.openSource). Kopf = Standard-Pane-Kopf wie in allen Apps: das App-Icon oben links gehört der Shell. -->
<main class="ctox-workspace coding-agents-module" data-coding-agents-root>
  <section class="ctox-pane coding-agents-runs" aria-label="Agent-Läufe">
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title" data-ca-title>Agent-Läufe</h2>
        </div>
      </div>
    </header>
    <div class="ctox-filterbar" data-shell-v2-header-row="2">
      <input class="ctox-pane-search" type="search" data-ca-search placeholder="Läufe suchen" aria-label="Läufe suchen">
    </div>
    <div class="ctox-pane-body coding-agents-well">
      <ol class="coding-agents-list" data-ca-list></ol>
      <p class="coding-agents-empty" data-ca-empty hidden></p>
    </div>
  </section>
</main>
