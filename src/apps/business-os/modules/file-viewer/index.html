<main class="ctox-workspace ctox-workspace--single file-viewer" data-file-viewer-root>
  <header class="file-viewer-toolbar ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
    <div class="ctox-pane-title-row">
      <div class="ctox-pane-titles">
        <h2 class="ctox-pane-title" data-file-title>Datei</h2>
      </div>
      <div class="ctox-pane-actions">
        <button class="ctox-pane-icon" data-short-de="Download" type="button" data-file-download aria-label="Herunterladen" title="Herunterladen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg></button>
      </div>
    </div>
  </header>
  <div class="file-viewer-metadata" data-file-metadata data-shell-v2-header-row="2"></div>
  <section class="file-viewer-content" data-file-content></section>
  <!-- Leerzustand ohne Datei (wie Vorschau/Fotos): ein Satz + Aktion; „Datei öffnen…“ zeigt die Auswahl aus `files`. -->
  <section class="file-viewer-start" data-file-start hidden>
    <div class="file-viewer-empty" data-file-empty>
      <strong data-file-empty-text>Keine Datei geöffnet</strong>
      <button class="ctox-button is-primary" type="button" data-file-open-picker>Datei öffnen…</button>
    </div>
    <div class="file-viewer-picker" data-file-picker hidden>
      <div class="file-viewer-picker-head">
        <strong data-file-picker-title>Datei öffnen</strong>
        <button class="ctox-button" type="button" data-file-picker-cancel>Abbrechen</button>
      </div>
      <input class="ctox-input" type="search" data-file-picker-search placeholder="Suchen" aria-label="Suchen">
      <div class="file-viewer-picker-list" role="listbox" data-file-picker-list></div>
    </div>
  </section>
</main>
