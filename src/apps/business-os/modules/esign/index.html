<main class="ctox-workspace ctox-workspace--two-pane esign-module" data-esign-root data-resize-frame>
  <!-- LEFT: record list (persistence/selector column) — canonical column
       grammar (data-pg-*). The shell auto-wires search/tray/reset/active-dot/
       view-toggle/band; this module writes only markup + counts/footer. -->
  <aside class="ctox-pane esign-left" aria-label="Signatur-Anfragen" data-esign-list-pane data-left-content>
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <!-- Kein Kicker im ERSTEN Kopf: das App-Icon steht direkt daneben und
             sagt dasselbe, und in den 212px, die neben Icon-Zone und
             Aktionsblock bleiben, verdraengt er genau den Titel, der das
             Versionsmenue der Shell traegt (Vertrag §4). Knowledge, die
             abgenommene Referenz, fuehrt aus demselben Grund keinen Kicker. -->
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title" data-copy="listTitle">Anfragen</h2>
        </div>
        <div class="ctox-pane-actions">
          <!-- Genau EINE gefuellte Primaeraktion je Kopf: das Anlegen ist der
               dominante Fluss dieser Spalte (identisch zu credentials/consent).
               Import/Export bleiben Umriss-Knoepfe. -->
          <button type="button" class="ctox-pane-icon is-primary" data-short-de="Neu" data-action="new" aria-label="Neu" title="Neu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="Import" data-action="import" aria-label="Importieren" title="Importieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M12 15l-4-4M12 15l4-4M5 21h14"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="Export" data-action="export" aria-label="Exportieren" title="Exportieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9M12 9l-4 4M12 9l4 4M5 3h14"/></svg></button>
        </div>
      </div>
    </header>
    <div class="ctox-filterbar" data-shell-v2-header-row="2">
      <input class="ctox-pane-search" type="search" data-pg-search placeholder="Suchen..." aria-label="Anfragen suchen" />
      <!-- EIN Umschalter, kein Zustandspaar (Betreiber-Direktive 31.08.): das
           Icon zeigt die Ansicht, in die gewechselt wird; data-pg-view traegt
           die AKTUELLE Ansicht und ist damit weiterhin der Wert, den die
           Shell-Grammatik (shared/pane-grammar.js) liest. Kein aria-pressed —
           der Knopf ist eine Aktion, kein Zustand. -->
      <button type="button" class="ctox-pane-icon esign-view-toggle" data-pg-view="cards" data-esign-view-toggle aria-label="Als Liste anzeigen" title="Als Liste anzeigen"><svg class="esign-view-icon" data-esign-view-icon="list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg><svg class="esign-view-icon" data-esign-view-icon="cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg></button>
      <button type="button" class="ctox-pane-icon ctox-filter-toggle" data-short-de="Filter" data-pg-tray-toggle aria-expanded="false" aria-label="Filter" title="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--surface-2)"/><circle cx="15" cy="12" r="2.4" fill="var(--surface-2)"/><circle cx="8" cy="17" r="2.4" fill="var(--surface-2)"/></svg></button>
    </div>
    <div class="ctox-filter-tray" data-pg-tray data-shell-v2-header-row="3" hidden>
      <div class="ctox-filter-row">
        <select class="ctox-select" data-pg-filter data-pg-name="subject_kind" data-pg-default="all" aria-label="Vertragstyp filtern">
          <option value="all" data-copy="allKinds">Alle Typen</option>
          <option value="arbeitsvertrag" data-copy="employment">Arbeitsvertrag</option>
          <option value="vermittlungsvertrag" data-copy="placement">Vermittlungsvertrag</option>
          <option value="ueberlassungsvertrag" data-copy="staffing">Überlassungsvertrag</option>
        </select>
        <button type="button" class="ctox-sort-dir" data-pg-reset aria-label="Filter zurücksetzen" title="Filter zurücksetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7"/><path d="M4 5v5h5"/></svg></button>
      </div>
    </div>
    <nav class="ctox-view-switch" aria-label="Ansichten">
      <div class="ctox-pane-tabs">
        <button type="button" class="ctox-pane-tab is-active" role="tab" data-pg-band="all" aria-selected="true"><span data-copy="viewAll">Alle</span><span class="view-count" data-pg-count="all"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="open" aria-selected="false"><span data-copy="viewOpen">Offen</span><span class="view-count" data-pg-count="open"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="done" aria-selected="false"><span data-copy="viewDone">Abgeschlossen</span><span class="view-count" data-pg-count="done"></span></button>
      </div>
    </nav>
    <div class="ctox-pane-body ctox-well">
      <div class="ctox-list" data-esign-list></div>
    </div>
  </aside>

  <button class="ctox-column-resizer" type="button" data-resizer="left" data-resizer-var="--ctox-left-width" data-resizer-min="260" data-resizer-max="520" aria-label="Spaltenbreite anpassen"></button>

  <!-- MAIN: record-bound workbench. The create composer stays as-is; selecting
       a request prefills it and auto-reveals the record detail + signer flow. -->
  <section class="ctox-pane esign-center" aria-label="Workbench" data-esign-workbench>
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title" data-esign-wb-title data-copy="composerTitle">Signatur anfordern</h2>
        </div>
        <div class="ctox-pane-actions">
          <button type="button" class="ctox-pane-icon" data-esign-collapse aria-pressed="false" aria-label="Detail einklappen" title="Detail einklappen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        </div>
      </div>
    </header>
    <div class="ctox-pane-scroll esign-workbench-scroll">
      <form class="ctox-compact-form" data-esign-form>
        <div class="ctox-compact-form__fields">
          <!-- Dokument aus der Liste wählen (DocuSign/Adobe Sign: „Dokument hinzufügen“ aus der Ablage), nie eine ID tippen. -->
          <div class="ctox-compact-field esign-picker" data-esign-doc-picker><span data-copy="document">Dokument</span><input type="hidden" name="document_id" data-esign-field="document_id" /><div class="esign-picked" data-esign-doc-picked hidden></div><input class="ctox-input" type="search" autocomplete="off" data-esign-doc-search data-copy-placeholder="documentSearch" placeholder="Dokument suchen" aria-label="Dokument suchen" /><div class="esign-options" role="listbox" data-esign-doc-options hidden></div></div>
          <label class="ctox-compact-field"><span data-copy="subjectKind">Vertragstyp</span><select class="ctox-select" name="subject_kind" data-esign-field="subject_kind"><option value="arbeitsvertrag" data-copy="employment">Arbeitsvertrag</option><option value="vermittlungsvertrag" data-copy="placement">Vermittlungsvertrag</option><option value="ueberlassungsvertrag" data-copy="staffing">Überlassungsvertrag</option></select></label>
          <!-- Empfänger wie DocuSign: Personenauswahl, je Zeile Name, E-Mail, Rolle; Reihenfolge = Signierreihenfolge. -->
          <div class="ctox-compact-field esign-picker esign-picker--wide" data-esign-signer-picker><span data-copy="signers">Unterzeichner</span><ol class="esign-recipients" data-esign-recipients></ol><input class="ctox-input" type="search" autocomplete="off" data-esign-person-search data-copy-placeholder="signerSearch" placeholder="Person hinzufügen" aria-label="Person hinzufügen" /><div class="esign-options" role="listbox" data-esign-person-options hidden></div></div>
        </div>
        <div class="ctox-compact-form__actions"><button class="ctox-button is-primary" type="submit" data-copy="create">Anlegen</button></div>
      </form>
      <div class="esign-detail" data-esign-detail></div>
    </div>
  </section>
</main>
