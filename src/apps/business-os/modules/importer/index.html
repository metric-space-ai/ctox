<main class="importer-module" data-importer-root data-imp-stage="source">
  <header class="ctox-pane-header imp-head" data-shell-v2-header-row="1">
    <div class="ctox-pane-title-row">
      <div class="ctox-pane-titles">
        <h2 class="ctox-pane-title" data-imp-title>App Importer</h2>
      </div>
      <div class="ctox-pane-actions">
        <button type="button" class="ctox-button is-primary imp-head-action" data-imp-open hidden>
          <span data-imp-copy="openApp">Open app</span><span aria-hidden="true">→</span>
        </button>
      </div>
    </div>
  </header>

  <aside class="imp-rail">
    <ol class="imp-steps" aria-label="Import progress" data-shell-v2-header-row="2">
      <li data-imp-step="source"><span>1</span><span><strong data-imp-copy="sourceStep">Source</strong></span></li>
      <li data-imp-step="progress"><span>2</span><span><strong data-imp-copy="progressStep">Porting</strong></span></li>
      <li data-imp-step="done"><span>3</span><span><strong data-imp-copy="liveStep">Live</strong></span></li>
    </ol>
  </aside>

  <section class="imp-workspace">

    <section class="imp-stage imp-source-stage" data-imp-source-section>
      <header class="imp-stage-header">
        <h2 data-imp-copy="sourceHeading">Import an app</h2>
      </header>
      <div class="imp-import-options">
        <label>
          <span data-imp-copy="categoryLabel">Category</span>
          <select class="ctox-input" data-imp-category>
            <option value="entertainment" data-imp-copy="categoryEntertainment" selected>Entertainment</option>
            <option value="productivity" data-imp-copy="categoryProductivity">Productivity</option>
            <option value="development" data-imp-copy="categoryDevelopment">Development</option>
            <option value="knowledge" data-imp-copy="categoryKnowledge">Knowledge</option>
            <option value="research" data-imp-copy="categoryResearch">Research</option>
            <option value="operations" data-imp-copy="categoryOperations">Operations</option>
            <option value="imported" data-imp-copy="categoryOther">Other</option>
          </select>
        </label>
      </div>
      <form class="imp-github" data-imp-github-form>
        <label for="imp-github-url" data-imp-copy="githubLabel">Public GitHub repository</label>
        <div class="imp-input-row">
          <span class="imp-input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1" /><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1" /></svg>
          </span>
          <input id="imp-github-url" type="url" class="ctox-input" data-imp-github-url placeholder="https://github.com/owner/repo" spellcheck="false" required />
          <button type="submit" class="ctox-button is-primary imp-submit" data-imp-github-btn>Start porting</button>
        </div>
      </form>
      <div class="imp-divider"><span data-imp-copy="or">or</span></div>
      <div class="imp-local-sources">
        <input type="file" data-imp-pick-files-input hidden />
        <button type="button" class="imp-folder" data-imp-pick-files data-imp-tip="sourceHint" title="Files go to CTOX as a snapshot.">
          <span class="imp-folder-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l4 4V20H7z" /><path d="M14 3.5V8h4" /></svg></span>
          <span><strong data-imp-copy="fileHeading">Choose source file</strong></span>
          <span class="imp-folder-arrow" aria-hidden="true">→</span>
        </button>
        <button type="button" class="imp-folder" data-imp-pick-folder data-imp-tip="folderHint" title="For multi-file projects, read access only.">
          <span class="imp-folder-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z" /></svg></span>
          <span><strong data-imp-copy="folderHeading">Choose project folder</strong></span>
          <span class="imp-folder-arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <section class="imp-stage imp-review-stage" data-imp-progress-section hidden>
      <header class="imp-stage-header">
        <h2 data-imp-progress-title>CTOX is porting the app.</h2>
        <p data-imp-progress-note>Securing source…</p>
      </header>
      <div class="imp-report">
        <dl class="ctox-fields imp-fields">
          <dt data-imp-copy="moduleLabel">Module</dt><dd data-imp-module-id></dd>
        </dl>
      </div>
      <ol class="imp-job-phases">
        <li data-imp-phase><span>1</span><strong data-imp-copy="phaseSource">Secure source</strong></li>
        <li data-imp-phase><span>2</span><strong data-imp-copy="phaseQueue">Queue</strong></li>
        <li data-imp-phase><span>3</span><strong data-imp-copy="phasePort">Port</strong></li>
        <li data-imp-phase><span>4</span><strong data-imp-copy="phaseValidate">Validate &amp; smoke</strong></li>
        <li data-imp-phase><span>5</span><strong data-imp-copy="phaseLive">Live</strong></li>
      </ol>
    </section>

    <section class="imp-stage imp-done-stage" data-imp-done-section hidden>
      <div class="imp-done-mark" aria-hidden="true">✓</div>
      <h2 data-imp-done-heading>The ported app is live.</h2>
      <div class="imp-done-copy" data-imp-done></div>
      <button type="button" class="ctox-button imp-back" data-imp-reset data-imp-copy="reset">Import another source</button>
    </section>
  </section>
</main>
