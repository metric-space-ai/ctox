<main class="ctox-workspace ctox-workspace--two-pane outbound-module" data-outbound-root data-resize-frame>
  <section class="ctox-pane outbound-left" data-left-content aria-label="Outbound Campaigns und Sequenzen">
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row"><div class="ctox-pane-titles"><h2 class="ctox-pane-title">Outbound</h2></div></div>
    </header>
    <div class="outbound-pane-toolbelt" data-shell-v2-header-row="2"><div></div></div>
  </section>
  <button class="ctox-column-resizer" type="button" data-outbound-column-resizer data-resizer="left" data-resizer-var="--ctox-left-width" data-resizer-min="280" data-resizer-max="520" aria-label="Spaltenbreite anpassen"></button>
  <section class="ctox-pane outbound-center" aria-label="Outbound Sequenz- und Campaign-Workbench">
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row"><div class="ctox-pane-titles"><h2 class="ctox-pane-title">Kampagne</h2></div></div>
    </header>
    <div class="outbound-pane-toolbelt" data-shell-v2-header-row="2"><div></div></div>
  </section>
</main>
<div class="ctox-modal" data-campaign-editor-modal hidden></div>
