<main class="ctox-workspace kundenpipeline-module is-actions-hidden" data-kundenpipeline-root data-resize-frame>
  <aside class="ctox-pane kundenpipeline-rail" data-left-content aria-label="Decision Hub Liste">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title">Kundenpipeline</h2>
        </div>
      </div>
      <div class="ctox-filterbar">
        <input class="ctox-pane-search" type="search" data-search placeholder="Entscheidungen suchen" aria-label="Entscheidungen suchen">
      </div>
    </header>
    <nav class="ctox-view-switch" aria-label="Decision Hub Ansichten">
      <div class="ctox-pane-tabs" role="tablist">
        <button class="ctox-pane-tab is-active" type="button" role="tab" data-filter="open" aria-selected="true">Offen <span class="view-count" data-count="open">0</span></button>
        <button class="ctox-pane-tab" type="button" role="tab" data-filter="all" aria-selected="false">Alle <span class="view-count" data-count="all">0</span></button>
      </div>
    </nav>
    <div class="ctox-pane-body ctox-well">
      <div class="ctox-list" data-decision-list tabindex="-1"></div>
    </div>
  </aside>

  <button class="ctox-column-resizer" type="button" data-resizer="left" data-resizer-var="--ctox-left-width" data-resizer-min="260" data-resizer-max="500" aria-label="Linke Spaltenbreite anpassen"></button>

  <section class="ctox-pane kundenpipeline-detail" data-detail-pane aria-label="Entscheidungsdetails">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker" data-detail-kicker></span>
          <h2 class="ctox-pane-title" data-detail-title></h2>
        </div>
        <div class="ctox-pane-actions">
          <button class="ctox-pane-icon kundenpipeline-toggle-actions" type="button" data-toggle-actions aria-label="Aktionen einblenden" title="Aktionen einblenden" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="ctox-pane-scroll kundenpipeline-detail-scroll" data-detail-body>
    </div>
  </section>

  <button class="ctox-column-resizer" type="button" data-resizer="right" data-resizer-var="--ctox-right-width" data-resizer-min="280" data-resizer-max="500" aria-label="Rechte Spaltenbreite anpassen"></button>

  <aside class="ctox-pane kundenpipeline-actions" data-right-content aria-label="Decision Hub Aktionen">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title">Freigabe</h2>
        </div>
      </div>
    </header>
    <div class="ctox-pane-scroll kundenpipeline-actions-scroll" data-action-body>
    </div>
  </aside>
</main>
