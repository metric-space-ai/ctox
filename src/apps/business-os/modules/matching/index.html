<main class="ctox-workspace matching-app is-objects-hidden" data-matching-workspace data-resize-frame>
  <aside class="ctox-pane matching-left" id="left" data-left-content data-pg-default-view="cards" aria-label="Anforderungen">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title column-title">Anforderungen</h2>
        </div>
        <div class="ctox-pane-actions">
          <button class="ctox-pane-icon" data-short-de="Neu" type="button" id="createRequirementBtn" aria-label="Anforderung anlegen" title="Anforderung anlegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="ctox-pane-icon" data-short-de="Import" type="button" id="requirementImportBtn" aria-label="Anforderungen importieren" title="Anforderungen importieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M12 15l-4-4M12 15l4-4M5 19h14"/></svg></button>
          <button class="ctox-pane-icon" data-short-de="Export" type="button" id="requirementExportBtn" aria-label="Anforderungen exportieren" title="Anforderungen exportieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M12 9 8 13M12 9l4 4M5 4h14"/></svg></button>
        </div>
      </div>
      <div class="ctox-filterbar">
        <input class="ctox-pane-search" id="sourceSearch" type="search" data-pg-search placeholder="Anforderungen suchen…" aria-label="Anforderungen suchen">
        <button type="button" class="ctox-pane-icon matching-view-toggle" data-matching-view-toggle data-matching-view="cards" aria-label="Als Liste anzeigen" title="Als Liste anzeigen"><svg data-view-icon="list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg><svg data-view-icon="cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg></button>
        <button type="button" class="ctox-pane-icon ctox-filter-toggle" data-short-de="Filter" data-pg-tray-toggle aria-expanded="false" aria-label="Filter" title="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--surface-2)"/><circle cx="15" cy="12" r="2.4" fill="var(--surface-2)"/><circle cx="8" cy="17" r="2.4" fill="var(--surface-2)"/></svg></button>
      </div>
      <div class="ctox-filter-tray" data-pg-tray hidden>
        <div class="ctox-filter-row">
          <select class="ctox-select" id="sourceGroupMode" data-pg-filter data-pg-name="activity" data-pg-default="all" aria-label="Aktivität">
            <option value="all">Alle Aktivitäten</option>
            <option value="active">Aktive Quellen</option>
            <option value="inactive">Inaktive Quellen</option>
          </select>
          <select class="ctox-select" data-pg-filter data-pg-name="sort" data-pg-default="updated" aria-label="Sortierung">
            <option value="updated">Zuletzt geändert</option>
            <option value="title">Titel</option>
            <option value="source">Quelle</option>
            <option value="matches">Meiste Matches</option>
          </select>
          <button type="button" class="ctox-sort-dir" data-pg-reset aria-label="Filter zurücksetzen" title="Filter zurücksetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7"/><path d="M4 5v5h5"/></svg></button>
        </div>
      </div>
    </header>
    <nav class="ctox-view-switch" aria-label="Anforderungsansichten">
      <div class="ctox-pane-tabs">
        <button type="button" class="ctox-pane-tab is-active" role="tab" data-pg-band="all" aria-selected="true">Alle<span class="view-count" data-pg-count="all"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="open" aria-selected="false">Offen<span class="view-count" data-pg-count="open"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="matched" aria-selected="false">Mit Matches<span class="view-count" data-pg-count="matched"></span></button>
      </div>
    </nav>
    <div class="ctox-pane-body ctox-well">
      <div class="ctox-list source-grid" id="sourceGrid" role="listbox" aria-label="Anforderungen"></div>
    </div>
    <input type="file" id="requirementImportInput" accept="application/json,.json" hidden>
  </aside>

  <button class="ctox-column-resizer" type="button" data-resizer="left" data-resizer-var="--ctox-left-width" data-resizer-min="240" data-resizer-max="480" aria-label="Spaltenbreite links anpassen"></button>

  <section class="ctox-pane matching-main" id="center" data-pg-default-view="cards" aria-label="Treffer">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker" id="sourceName"></span>
          <h2 class="ctox-pane-title column-title" id="workbenchTitle">Anforderung auswählen</h2>
        </div>
        <div class="ctox-pane-actions">
          <button class="ctox-pane-icon" data-short-de="Berechnen" type="button" id="runMatchingBtn" aria-label="Matching berechnen" title="Matching berechnen" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg></button>
          <button class="ctox-pane-icon" type="button" id="toggleObjectsPane" data-toggle-objects aria-pressed="false" aria-label="Objekt-Nachweise einblenden" title="Objekt-Nachweise einblenden" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
        </div>
      </div>
      <div class="ctox-filterbar" id="listTools">
        <input class="ctox-pane-search" id="requirementSearch" type="search" data-pg-search placeholder="Kandidaten und Nachweise suchen…" aria-label="Matches durchsuchen">
        <button type="button" class="ctox-pane-icon matching-view-toggle" data-matching-view-toggle data-matching-view="cards" aria-label="Als Liste anzeigen" title="Als Liste anzeigen"><svg data-view-icon="list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg><svg data-view-icon="cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg></button>
        <button type="button" class="ctox-pane-icon ctox-filter-toggle" data-short-de="Filter" data-pg-tray-toggle aria-expanded="false" aria-label="Match-Filter" title="Match-Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--surface-2)"/><circle cx="15" cy="12" r="2.4" fill="var(--surface-2)"/><circle cx="8" cy="17" r="2.4" fill="var(--surface-2)"/></svg></button>
      </div>
      <div class="ctox-filter-tray" data-pg-tray hidden>
        <div class="ctox-filter-row">
          <select class="ctox-select" id="requirementFilter" data-pg-filter data-pg-name="score" data-pg-default="all" aria-label="Mindestscore">
            <option value="all">Alle Scores</option>
            <option value="80">80% und mehr</option>
            <option value="60">60% und mehr</option>
            <option value="scored">Nur bewertet</option>
          </select>
          <select class="ctox-select" data-pg-filter data-pg-name="status" data-pg-default="all" aria-label="Prozessstatus">
            <option value="all">Alle Prozesse</option>
            <option value="active">Aktiv</option>
            <option value="paused">Pausiert</option>
          </select>
          <button type="button" class="ctox-sort-dir" data-pg-reset aria-label="Filter zurücksetzen" title="Filter zurücksetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7"/><path d="M4 5v5h5"/></svg></button>
        </div>
      </div>
    </header>
    <nav class="ctox-view-switch" aria-label="Workbench Ansichten">
      <div class="ctox-pane-tabs">
        <button class="ctox-pane-tab is-active" type="button" id="tabList" role="tab" data-pg-band="ranking" aria-selected="true">Rangliste<span class="view-count" data-pg-count="ranking"></span></button>
        <button class="ctox-pane-tab" type="button" id="tabMap" role="tab" data-pg-band="matrix" aria-selected="false">Matrix<span class="view-count" data-pg-count="matrix"></span></button>
      </div>
    </nav>
    <div class="ctox-pane-body ctox-well matching-workbench-well">
      <div class="ctox-list requirement-list" id="requirementList" role="listbox" aria-label="Gerankte Kandidaten"></div>
      <div class="map-wrap" id="mapWrap" hidden><div class="map" id="map"></div></div>
    </div>
    <footer class="ctox-pane-footer"><span id="matchFooter"></span></footer>
  </section>

  <button class="ctox-column-resizer" type="button" data-resizer="right" data-resizer-var="--ctox-right-width" data-resizer-min="260" data-resizer-max="480" aria-label="Spaltenbreite rechts anpassen"></button>

  <aside class="ctox-pane matching-objects" id="right" data-right-content aria-label="Objekt-Nachweise">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker">Nachweise</span>
          <h2 class="ctox-pane-title column-title" id="objectEvidenceTitle">Kein Match ausgewählt</h2>
        </div>
        <div class="ctox-pane-actions">
          <button class="ctox-pane-icon" data-short-de="Import" type="button" id="objectImportPdfBtn" aria-label="Objekte importieren" title="Objekte importieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M12 15l-4-4M12 15l4-4M5 19h14"/></svg></button>
          <button class="ctox-pane-icon" data-short-de="Export" type="button" id="objectExportBtn" aria-label="Objekt-Nachweise exportieren" title="Objekt-Nachweise exportieren" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M12 9 8 13M12 9l4 4M5 4h14"/></svg></button>
          <button class="ctox-pane-icon" type="button" id="collapseObjectsPane" aria-label="Objekt-Nachweise ausblenden" title="Objekt-Nachweise ausblenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        </div>
      </div>
    </header>
    <input type="file" id="objectImportPdfInput" accept="application/pdf,.pdf,image/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,application/json,.json" multiple hidden>
    <div class="ctox-pane-body ctox-pane-scroll" id="objectList"></div>
    <footer class="ctox-pane-footer"><span id="objectFooter"></span></footer>
  </aside>
</main>


  <!-- Modal: Notizen & Fortschritt (pro Objekt & Anforderung) -->
  <div class="ctox-modal" id="noteModal" hidden role="dialog" aria-modal="true" aria-labelledby="noteTitle" aria-hidden="true">
    <div class="ctox-modal-card">
      <header class="ctox-modal-header">
        <h3 class="ctox-modal-title" id="noteTitle">Notizen</h3>
        <button class="ctox-pane-icon" type="button" data-close-modal aria-label="Schließen" title="Schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="ctox-modal-body">
        <div class="modal-row">
          <label class="muted" style="min-width:110px">Fortschritt</label>
          <input id="noteProgress" class="range" type="range" min="0" max="100" step="5" />
          <span id="noteProgressVal">0%</span>
        </div>
        <textarea id="noteText" class="ctox-textarea" placeholder="Notizen zum Matchingprozess…"></textarea>
      </div>
      <footer class="ctox-modal-footer">
        <button class="ctox-button is-primary" type="button" id="saveNote" title="Speichern">Speichern</button>
      </footer>
    </div>
  </div>

  <!-- Slide-over-Ebene: die Clip-Huelle (overflow:hidden) haelt die geschlossenen,
       wegtransformierten Panels aus dem Scroll-Ueberlauf der Fensterbühne heraus
       (Shell-V2-Geometrie: hscroll). position:fixed waere hier falsch - der
       business-app-window-Container ist der Containing-Block, also wuerden die
       Panels die Buehne um ihre eigene Breite nach rechts aufdehnen. -->
  <div class="matching-overlays">
  <!-- Objekt Slide-over (rechts) -->
  <aside class="object" id="objectPanel" aria-hidden="true">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title column-title" id="objectTitle">Objekt</h2>
        </div>
        <div class="ctox-pane-actions">
          <button class="ctox-pane-icon" type="button" id="objectClose" aria-label="Schließen" title="Schließen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="object-body" id="objectBody"></div>
  </aside>
  <!-- Anforderung Slide-over (links) -->
  <aside class="jp" id="requirementPanel" aria-hidden="true">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title column-title" id="jpTitle">Anforderung</h2>
        </div>
        <div class="ctox-pane-actions">
          <span class="ctox-badge" id="jpMeta"></span>
          <button class="ctox-pane-icon" type="button" id="jpClose" aria-label="Schließen" title="Schließen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="jp-body" id="jpBody"></div>
  </aside>
  </div>

    <!-- Modal: Kontaktstatus (Quelle/Objekt) -->
  <div class="ctox-modal" id="relModal" hidden role="dialog" aria-modal="true" aria-labelledby="relTitle" aria-hidden="true">
    <div class="ctox-modal-card rel-modal-card">
      <header class="ctox-modal-header">
        <h3 class="ctox-modal-title" id="relTitle">Kontaktstatus</h3>
        <button class="ctox-pane-icon" type="button" data-close-rel-modal aria-label="Schließen" title="Schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="ctox-modal-body">

        <!-- NEU: großer Portrait-Platzhalter -->
        <div id="relPhoto" class="rel-photo"></div>
        <div class="ctox-choice-group" id="relOptions" role="radiogroup" aria-label="Kontaktstatus">
          <label class="ctox-choice">
            <input type="radio" name="relState" value="1" />
            <span>
              <span class="lg-dot requirement" style="margin-right:6px"></span>
              <span data-rel-label="exists">Kontakt besteht</span>
            </span>
          </label>
          <label class="ctox-choice">
            <input type="radio" name="relState" value="0" />
            <span>
              <span class="lg-dot" style="margin-right:6px; background:var(--none)"></span>
              <span data-rel-label="missing">Noch kein Kontakt</span>
            </span>
          </label>
        </div>
      </div>
      <footer class="ctox-modal-footer">
        <button class="ctox-button is-primary" type="button" id="relSave" title="Kontaktstatus speichern">Speichern</button>
      </footer>
    </div>
  </div>

  <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
    <button class="icon-btn ctox-pane-icon image-lightbox-close" id="imageLightboxClose" title="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="imageLightboxImg" alt="Bildvorschau" />
  </div>


    <!-- Match-Details Bottom Bar -->
  <aside class="match-bar" id="matchDetailBar" aria-hidden="true">
    <div class="match-bar-inner">
      <header class="match-bar-header">
        <div class="match-bar-titles">
          <div class="match-bar-label">Match-Details</div>
          <div class="match-bar-main">
            <span id="matchBarRequirementLabel">–</span>
            <span class="dot-sep">·</span>
            <span id="matchBarObjectLabel">–</span>
          </div>
        </div>
        <div class="match-bar-score" id="matchBarScore">–</div>
        <button class="icon-btn ctox-pane-icon" id="matchBarClose" title="Details schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="match-bar-tags" id="matchBarTags"></div>

      <div class="match-bar-content" id="matchBarContent">
        <!-- wird per JS mit einzelnen Match-Items (Nachweisen) gefüllt -->
      </div>
    </div>
  </aside>
