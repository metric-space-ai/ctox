<main class="ctox-workspace ctox-workspace--two-pane app-store-module" data-app-store-root data-resize-frame>
  <!-- The pane chrome below is the canonical data-pg-* grammar — the SHELL
       wires search / tray / reset / active-dot / band / counts / footer
       (autoWirePaneGrammar); the module only renders lists and listens to
       ctox-pane-grammar-change. The ONE exception is the view toggle: since
       31.08.2026 it is a single action button, not the grammar's two-button
       [data-pg-view] radio pair, so the module owns it. This file is the
       single source of truth for the module markup: index.js fetches it with
       the JS cache-buster (loadModuleMarkup), like
       ctox/coding-agents/knowledge/threads. -->
  <aside class="ctox-pane store-left" aria-label="Store Navigation">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title" data-t="title">App Store</h2>
        </div>
        <div class="ctox-pane-actions">
        </div>
      </div>
    </header>

    <div class="ctox-pane-body">
      <div class="store-sidebar">
        <!-- Scope shards are pure selectors: icon + title + ONE meta line with
             the parenthesized count (zeros included) — no badge pills. -->
        <nav class="ctox-list store-category-list" data-scope-list>
          <button class="ctox-list-item category-btn active is-selected" data-scope="marketplace">
            <span class="cat-icon">M</span>
            <span class="cat-main">
              <span class="cat-label" data-t="scopeMarketplace">Marketplace</span>
              <span class="cat-meta" data-scope-count>(0)</span>
            </span>
          </button>
          <button class="ctox-list-item category-btn" data-scope="template">
            <span class="cat-icon">+</span>
            <span class="cat-main">
              <span class="cat-label" data-t="scopeTemplates">Templates</span>
              <span class="cat-meta" data-scope-count>(0)</span>
            </span>
          </button>
          <button class="ctox-list-item category-btn" data-scope="installed">
            <span class="cat-icon">✓</span>
            <span class="cat-main">
              <span class="cat-label" data-t="scopeInstalled">Installed</span>
              <span class="cat-meta" data-scope-count>(0)</span>
            </span>
          </button>
          <button class="ctox-list-item category-btn" data-scope="local">
            <span class="cat-icon">*</span>
            <span class="cat-main">
              <span class="cat-label" data-t="scopeLocal">Local Modules</span>
              <span class="cat-meta" data-scope-count>(0)</span>
            </span>
          </button>
          <button class="ctox-list-item category-btn" data-scope="system">
            <span class="cat-icon">◆</span>
            <span class="cat-main">
              <span class="cat-label" data-t="scopeSystem">System</span>
              <span class="cat-meta" data-scope-count>(0)</span>
            </span>
          </button>
          <button class="ctox-list-item category-btn" data-scope="all">
            <span class="cat-icon">All</span>
            <span class="cat-main">
              <span class="cat-label" data-t="scopeAll">Everything</span>
              <span class="cat-meta" data-scope-count>(0)</span>
            </span>
          </button>
        </nav>
      </div>
    </div>
    <footer class="store-footer"><span data-pg-footer></span></footer>
  </aside>

  <button class="ctox-column-resizer" type="button" data-resizer="left" data-resizer-var="--ctox-left-width" data-resizer-min="240" data-resizer-max="500" aria-label="Spaltenbreite anpassen"></button>

  <section class="ctox-pane store-center" aria-label="Applications Catalog">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <h2 class="ctox-pane-title" data-visible-category-title>Marketplace</h2>
        </div>
        <!-- Standing catalog actions are collected header icons (create + the
             two import paths + export + GitHub discovery refresh) — never text buttons
             in the content flow. Glyphs mirror the shared action-icon set
             (24 viewBox, stroke 1.8, round caps). -->
        <div class="ctox-pane-actions store-pane-actions">
          <button type="button" class="ctox-pane-icon" data-action="create-scratch" aria-label="Zum App Creator wechseln, Rueckweg: App Store" title="Zum App Creator wechseln, Rueckweg: App Store" data-t-title="createScratchTitle" data-t-aria="createScratchTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="GitHub" data-action="install-github" aria-label="App aus einem eigenen GitHub-Repository installieren (externe Quelle)" title="App aus einem eigenen GitHub-Repository installieren (externe Quelle)" data-t-title="installGithubTitle" data-t-aria="installGithubTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M12 15l-4-4M12 15l4-4M5 19h14"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="ZIP" data-action="install-zip" aria-label="App aus einer hochgeladenen .zip-Datei installieren (externe Quelle)" title="App aus einer hochgeladenen .zip-Datei installieren (externe Quelle)" data-t-title="installZipTitle" data-t-aria="installZipTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M12 4 8 8M12 4l4 4M5 19h14"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="Export" data-export-catalog aria-label="Sichtbare Katalogliste exportieren" title="Sichtbare Katalogliste exportieren" data-t-title="exportCatalog" data-t-aria="exportCatalog"></button>
        </div>
      </div>
      <!-- Row 2: filter section — search + the single view toggle + collapsed
           tray. The data-pg-* attributes are wired by the shell grammar; the
           view toggle is module-owned (see below). -->
      <div class="store-filterbar">
        <input class="ctox-pane-search" data-pg-search type="search" placeholder="Module, Templates, Apps suchen..." data-t-placeholder="searchPlaceholder" aria-label="App Store durchsuchen" data-t-aria="searchAria" />
        <!-- ONE control, not two (Betreiber-Direktive 31.08.2026): the glyph
             shows the view the click switches TO, aria-label/title say the same
             thing, and there is no aria-pressed — the button is an action, not
             a state. The shell grammar's [data-pg-view] pair is a two-button
             radio contract, so this single toggle is module-owned; the module
             also owns state.viewMode instead of reading it back from the
             grammar event. -->
        <button type="button" class="ctox-pane-icon store-view-toggle" data-store-view-toggle data-view-mode="cards" aria-label="Als Liste anzeigen" title="Als Liste anzeigen">
          <span class="store-view-glyph" data-view-glyph="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></span>
          <span class="store-view-glyph" data-view-glyph="cards" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg></span>
        </button>
        <button type="button" class="ctox-pane-icon store-filter-toggle" data-short-de="Filter" data-pg-tray-toggle aria-expanded="false" aria-label="Filter" title="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--surface-2)"/><circle cx="15" cy="12" r="2.4" fill="var(--surface-2)"/><circle cx="8" cy="17" r="2.4" fill="var(--surface-2)"/></svg></button>
      </div>
      <div class="store-filter-advanced" data-pg-tray hidden>
        <div class="store-filter-row">
          <select class="ctox-select store-select" data-pg-filter data-pg-name="category" data-pg-default="all" aria-label="Kategorie">
            <option value="all">Alle Kategorien</option>
          </select>
          <select class="ctox-select store-select" data-pg-filter data-pg-name="sort" data-pg-default="title" aria-label="Sortieren nach">
            <option value="title">Name</option>
            <option value="category">Kategorie</option>
          </select>
          <button type="button" class="store-sort-dir store-filter-reset" data-pg-reset aria-label="Filter zurücksetzen" title="Filter zurücksetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7"/><path d="M4 5v5h5"/></svg></button>
        </div>
      </div>
    </header>
    <!-- Row 3: counted view band — catalog vs. pending updates. -->
    <nav class="store-view-switch" aria-label="Katalog Ansichten">
      <div class="ctox-pane-tabs">
        <button type="button" class="ctox-pane-tab is-active" role="tab" data-pg-band="catalog" aria-selected="true">Katalog<span class="view-count" data-pg-count="catalog"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="updates" aria-selected="false">Updates<span class="view-count" data-pg-count="updates"></span></button>
      </div>
    </nav>

    <div class="ctox-pane-body store-well">
      <!-- Shelf rendering: WebGL retail boxes; scroll on the well drives the shelf. -->
      <div class="store-shelf-stage" data-shelf-stage>
        <canvas class="store-shelf-canvas" data-shelf-canvas aria-label="App-Pakete als Regal" role="img"></canvas>
        <div class="store-shelf-scroll" data-shelf-scroll>
          <div class="store-shelf-track" data-shelf-track></div>
        </div>
      </div>

      <!-- List rendering (canonical compact counterpart). -->
      <div class="store-card-grid" data-apps-grid hidden></div>

      <!-- Detail: box flies into pose (shelf) / plain panel (list); real actions live here. -->
      <aside class="store-detail" data-detail-drawer hidden aria-label="App Details">
        <header class="store-detail-header">
          <div class="store-detail-title-row">
            <div class="app-logo-large" data-detail-icon>?</div>
            <div class="store-detail-heading">
              <h3 class="store-detail-title" data-detail-title data-t="drawerNoSelection">Keine App ausgewählt</h3>
              <div class="store-detail-badges">
                <span class="ctox-badge" data-detail-version>-</span>
                <span class="ctox-badge is-info" data-detail-category>Empty</span>
                <span class="ctox-badge" data-detail-status data-t="statusNoSelection">No selection</span>
              </div>
            </div>
          </div>
          <button type="button" class="ctox-pane-icon" data-close-drawer title="Zurück zu allen Apps" aria-label="Zurück zu allen Apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </header>
        <div class="store-detail-body">
          <div class="store-detail-actions" data-detail-actions></div>
          <dl class="ctox-fields store-detail-fields">
            <dt data-t="labelDeveloper">Developer</dt>
            <dd data-detail-developer>CTOX</dd>
            <dt data-t="labelLicense">License</dt>
            <dd data-detail-license>AGPL-3.0-only</dd>
            <dt data-t="labelSource">Source</dt>
            <dd data-detail-source>GitHub</dd>
          </dl>
          <figure class="store-detail-capture" data-detail-capture hidden>
            <img alt="" data-detail-capture-img loading="lazy">
          </figure>
          <div class="store-readme-section">
            <h4 data-t="readmeTitle">Beschreibung</h4>
            <article class="markdown-document" data-readme-content></article>
          </div>
        </div>
      </aside>
    </div>
    <footer class="store-footer"><span data-pg-footer></span></footer>
  </section>
</main>
