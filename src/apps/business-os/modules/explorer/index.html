<main class="ctox-workspace ctox-workspace--single app-explorer" data-explorer-root>
  <header class="app-explorer-toolbar ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
    <div class="ctox-pane-title-row">
      <div class="ctox-pane-titles">
        <h2 class="ctox-pane-title" data-explorer-title>Files</h2>
        <span class="app-explorer-count" data-explorer-count></span>
      </div>
      <div class="ctox-pane-actions app-explorer-actions">
        <button class="ctox-pane-icon" type="button" data-explorer-selection-actions aria-label="Aktionen für Auswahl" aria-haspopup="menu" disabled><span aria-hidden="true">⋯</span></button>
        <button class="ctox-pane-icon" type="button" data-explorer-new-folder aria-label="Neuer Ordner" title="Neuer Ordner"><span aria-hidden="true">＋</span><span data-explorer-new-folder-label hidden>Neuer Ordner</span></button>
        <button class="ctox-pane-icon" type="button" data-explorer-upload aria-label="Dateien hochladen" title="Dateien hochladen"><span aria-hidden="true">⇧</span><span hidden>Upload</span></button>
        <input data-explorer-file-input type="file" multiple hidden>
      </div>
    </div>
  </header>
  <div class="app-explorer-commandbar" data-shell-v2-header-row="2">
    <div class="app-explorer-nav" aria-label="Navigation">
      <button type="button" data-explorer-up aria-label="Übergeordneter Ordner" title="Übergeordneter Ordner">⌃</button>
      <button type="button" data-explorer-refresh aria-label="Aktualisieren" title="Aktualisieren">↻</button>
    </div>
    <div class="app-explorer-address" data-explorer-address>
      <span>Business OS</span>
      <b data-explorer-path>Files</b>
    </div>
    <label class="app-explorer-search">
      <span aria-hidden="true">⌕</span>
      <input data-explorer-search>
    </label>
  </div>
  <div class="app-explorer-body">
    <aside class="app-explorer-sidebar" data-explorer-sources></aside>
    <section class="app-explorer-main">
      <div class="app-explorer-heading">
        <div class="app-explorer-view-toggle" data-explorer-view-toggle>
          <select data-explorer-sort>
            <option value="modified" data-explorer-sort-modified>Geändert: neueste</option>
            <option value="created" data-explorer-sort-created>Erstellt: neueste</option>
            <option value="name" data-explorer-sort-name>Name</option>
            <option value="kind" data-explorer-sort-kind>Art</option>
          </select>
          <button type="button" class="is-active">Details</button>
        </div>
      </div>
      <section class="app-explorer-table" data-explorer-table></section>
      <footer class="app-explorer-status" data-explorer-status></footer>
    </section>
    <aside class="app-explorer-preview" data-explorer-preview></aside>
  </div>
</main>
