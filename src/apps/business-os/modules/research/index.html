<main class="ctox-workspace research-module" data-research-root data-resize-frame>
  <section class="ctox-pane research-pane research-left" aria-label="Research tasks">
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker">Web Research</span>
          <!-- Kurzer Titel wie im Referenzmodul (knowledge): in der
               Dreispaltenansicht liegt die 80px-Icon-Zone auf diesem Kopf, der
               Titel hat dort ~96px. "Knowledge Dashboards" (173px) konnte dort
               nur als "Knowledge Das..." stehen (Betreiber-Befund 31.08.). -->
          <h2 class="ctox-pane-title">Dashboards</h2>
        </div>
        <!-- Genau eine gefuellte Primaeraktion je Kopf: links das Anlegen. -->
        <div class="ctox-pane-actions">
          <button type="button" class="ctox-pane-icon is-primary" data-action="new-task" aria-label="Research anlegen" title="Research anlegen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </header>
    <div class="research-left-scroll">
      <section class="research-section">
        <div class="research-section-head">
          <strong>Aufgaben</strong>
          <span>0 aktiv</span>
        </div>
        <div class="research-task-list"></div>
      </section>
      <section class="research-section">
        <div class="research-section-head">
          <strong>Ranking</strong>
          <span>Portfolio priority</span>
        </div>
        <div class="research-ranking-list"></div>
      </section>
    </div>
  </section>
  <button class="ctox-column-resizer" type="button" data-resizer="left" data-resizer-var="--research-left-width" data-resizer-min="240" data-resizer-max="520" aria-label="Linke Spaltenbreite anpassen"></button>
  <section class="ctox-pane research-pane research-center" aria-label="Web Research dashboard">
    <header class="ctox-pane-header ctox-pane-band research-center-header" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker">Web Research</span>
          <h2 class="ctox-pane-title">Semantic Graph &amp; Evidence Workbench</h2>
        </div>
        <!-- Ohne ausgewaehlte Aufgabe: einzige Aktion des Mittelkopfs ist das Anlegen (v4: kein Nachladen). -->
        <div class="ctox-pane-actions">
          <button type="button" class="ctox-pane-icon is-primary" data-action="new-task" aria-label="Research anlegen" title="Research anlegen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </header>
  </section>
  <button class="ctox-column-resizer" type="button" data-resizer="right" data-resizer-var="--research-right-width" data-resizer-min="240" data-resizer-max="460" aria-label="Rechte Spaltenbreite anpassen"></button>
  <section class="ctox-pane research-pane research-right" aria-label="Research context">
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker">Context</span>
          <h2 class="ctox-pane-title">Research</h2>
        </div>
        <!-- Dominante Aktion der Kontextspalte: aus der Research-Aufgabe die
             Knowledge Base bauen. Ohne Aufgabe ist sie ehrlich deaktiviert. -->
        <div class="ctox-pane-actions">
          <button type="button" class="ctox-pane-icon is-primary" data-action="build-knowledge" disabled aria-disabled="true" aria-label="Knowledge aufbauen" title="Knowledge aufbauen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15ZM4 18a2.5 2.5 0 0 1 2.5-2.5H20M8 7h8"/></svg></button>
        </div>
      </div>
    </header>
    <div class="research-right-scroll">
    </div>
  </section>
</main>
