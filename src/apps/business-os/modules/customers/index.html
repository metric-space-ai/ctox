<main class="ctox-workspace ctox-workspace--two-pane customers-module" data-customers-root data-resize-frame>
  <!-- LEFT = customer/account selector. Canonical column grammar is declarative
       and SHELL-wired through data-pg-*; the module only reacts to the bubbling
       ctox-pane-grammar-change event and writes counts/footer through the
       null-guarded pane.__ctoxPaneGrammar handle. -->
  <aside class="ctox-pane customers-left" aria-label="Kundenkonten" data-left-content data-pg-default-view="cards">
    <header class="ctox-pane-header ctox-pane-band">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker">CRM</span>
          <h2 class="ctox-pane-title" data-customers-list-title>Kunden</h2>
        </div>
        <div class="ctox-pane-actions">
          <button type="button" class="ctox-pane-icon" data-short-de="Neu" data-customers-action="create-account" aria-label="Kunde anlegen" title="Kunde anlegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="Speichern" data-customers-action="save-view" aria-label="Ansicht speichern" title="Ansicht speichern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="Import" data-customers-action="import-customers" aria-label="Kunden importieren" title="Kunden importieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M12 15l-4-4M12 15l4-4M5 21h14"/></svg></button>
          <button type="button" class="ctox-pane-icon" data-short-de="Export" data-customers-action="export-customers" aria-label="Kunden exportieren" title="Kunden exportieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9M12 9l-4 4M12 9l4 4M5 3h14"/></svg></button>
          <input type="file" data-customers-import-input accept="application/json,.json" hidden />
        </div>
      </div>
      <div class="ctox-filterbar">
        <input class="ctox-pane-search" type="search" data-pg-search placeholder="Kunden suchen..." aria-label="Kunden suchen" />
        <!-- ONE control, not two: the toggle is an ACTION, not a state. The
             icon shows the view it switches TO, label/title say so, and there
             is deliberately no aria-pressed (Betreiber-Direktive 31.08.2026).
             It is module-wired (data-customers-view-toggle), not shell-wired:
             shared/pane-grammar.js derives `view` from aria-pressed across
             several [data-pg-view] buttons, which a single action button
             cannot express. index.js keeps the pane's data-pg-default-view in
             sync so the grammar event still reports the true view. -->
        <button type="button" class="ctox-pane-icon customers-view-toggle" data-customers-view-toggle data-customers-view="cards" aria-label="Als Liste anzeigen" title="Als Liste anzeigen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
        <button type="button" class="ctox-pane-icon ctox-filter-toggle" data-short-de="Filter" data-pg-tray-toggle aria-expanded="false" aria-label="Filter" title="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--surface-2)"/><circle cx="15" cy="12" r="2.4" fill="var(--surface-2)"/><circle cx="8" cy="17" r="2.4" fill="var(--surface-2)"/></svg></button>
      </div>
      <div class="ctox-filter-tray" data-pg-tray hidden>
        <div class="ctox-filter-row">
          <select class="ctox-select" data-pg-filter data-pg-name="stage" data-pg-default="all" aria-label="Lifecycle filtern">
            <option value="all">Alle Lifecycle-Phasen</option>
            <option value="prospect">Prospect</option>
            <option value="onboarding">Onboarding</option>
            <option value="active">Aktiv</option>
            <option value="renewal">Renewal</option>
            <option value="expansion">Expansion</option>
            <option value="at_risk">Gefährdet</option>
            <option value="churned">Churned</option>
          </select>
          <select class="ctox-select" data-pg-filter data-pg-name="health" data-pg-default="all" aria-label="Gesundheit filtern">
            <option value="all">Alle Gesundheitswerte</option>
            <option value="healthy">Healthy</option>
            <option value="neutral">Neutral</option>
            <option value="at_risk">At Risk</option>
            <option value="critical">Kritisch</option>
            <option value="unknown">Unbekannt</option>
          </select>
          <select class="ctox-select" data-pg-filter data-pg-name="sort" data-pg-default="last_activity_at_ms" aria-label="Sortierung">
            <option value="last_activity_at_ms">Letzte Aktivität</option>
            <option value="name">Name</option>
            <option value="customer_stage">Lifecycle</option>
            <option value="health_status">Gesundheit</option>
            <option value="annual_recurring_revenue_cents">ARR</option>
          </select>
          <select class="ctox-select" data-pg-filter data-pg-name="direction" data-pg-default="desc" aria-label="Sortierrichtung">
            <option value="desc">Absteigend</option>
            <option value="asc">Aufsteigend</option>
          </select>
          <select class="ctox-select" data-customers-saved-view aria-label="Gespeicherte Ansicht">
            <option value="">Gespeicherte Ansicht</option>
          </select>
          <button type="button" class="ctox-sort-dir" data-pg-reset aria-label="Filter zurücksetzen" title="Filter zurücksetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7"/><path d="M4 5v5h5"/></svg></button>
        </div>
      </div>
    </header>
    <nav class="ctox-view-switch" aria-label="Kunden Lifecycle">
      <div class="ctox-pane-tabs">
        <button type="button" class="ctox-pane-tab is-active" role="tab" data-pg-band="all" aria-selected="true">Alle<span class="view-count" data-pg-count="all"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="active" aria-selected="false">Aktiv<span class="view-count" data-pg-count="active"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="renewal" aria-selected="false">Renewal<span class="view-count" data-pg-count="renewal"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="risk" aria-selected="false">Risiko<span class="view-count" data-pg-count="risk"></span></button>
      </div>
    </nav>
    <div class="ctox-pane-body ctox-well">
      <div class="ctox-list customers-account-list" data-customers-account-list></div>
    </div>
    <footer class="ctox-pane-footer"><span data-pg-footer></span></footer>
  </aside>

  <button class="ctox-column-resizer" type="button" data-resizer="left" data-resizer-var="--customers-left-width" data-resizer-min="250" data-resizer-max="480" aria-label="Linke Spalte anpassen"></button>

  <!-- MAIN = selected account workbench. Contacts, activity, deals, tasks,
       notes, linked files/apps and existing handoff/dedupe command flows stay
       inside this single primary surface; there is deliberately no third pane. -->
  <section class="ctox-pane customers-main" aria-label="Kunden Arbeitsbereich">
    <!-- Static initial head: the workbench head exists ALWAYS, also before the
         first JS render and without a selection (no display:none in the empty
         state). Like the left head it is one element with two shell bands
         (title row + tabs row), so both pane heads measure the same height.
         renderMain() replaces the whole [data-customers-main] innerHTML with
         markup that starts with the same two-band .ctox-pane-header, so this
         head is superseded, never removed early or duplicated. -->
    <div data-customers-main>
      <header class="ctox-pane-header ctox-pane-band">
        <div class="ctox-pane-title-row">
          <div class="ctox-pane-titles">
            <span class="ctox-pane-kicker">CRM</span>
            <h2 class="ctox-pane-title">Arbeitsbereich</h2>
          </div>
          <div class="ctox-pane-actions"></div>
        </div>
        <nav class="ctox-pane-band customers-workbench-tabs" aria-label="Arbeitsbereich">
          <div class="ctox-pane-tabs" role="tablist">
            <button class="ctox-pane-tab is-active" type="button" role="tab" aria-selected="true" data-customers-detail-tab="overview">Übersicht</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="contacts">Kontakte</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="opportunities">Opportunities</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="timeline">Aktivitäten</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="tasks">Aufgaben</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="notes">Notizen</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="files">Dateien</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="apps">Apps</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="handoff">Übergabe</button>
            <button class="ctox-pane-tab" type="button" role="tab" aria-selected="false" data-customers-detail-tab="dedupe">Dubletten</button>
          </div>
        </nav>
      </header>
    </div>
  </section>
</main>
