<main class="ctox-workspace reports-module is-actions-hidden" data-reports-root data-resize-frame>
  <!-- The rail chrome below is the canonical data-pg-* grammar — the SHELL
       wires search / view toggle / tray / reset / active-dot / band / counts /
       footer (autoWirePaneGrammar); the module only renders lists and listens
       to ctox-pane-grammar-change. This file is the single source of truth for
       the module markup: index.js fetches it with the JS cache-buster
       (loadModuleMarkup), like ctox/coding-agents/knowledge/threads/app-store. -->
  <aside class="ctox-pane reports-rail" aria-label="Reports Liste">
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker">CTOX Intake</span>
          <h2 class="ctox-pane-title">Bugs &amp; Features</h2>
        </div>
        <!-- Standing rail action: JSON export of the filtered list. No import
             (reports arrive through CTOX intake flows) and no refresh button —
             the module keeps itself current (reactive). It is the rail's ONLY
             standing action and therefore carries `is-primary` — the filled
             variant marks the one dominant flow action per header
             (shared/base.css). Never add a second filled button here. -->
        <div class="ctox-pane-actions">
          <button type="button" class="ctox-pane-icon is-primary" data-action="export-json" aria-label="Gefilterte Liste als JSON exportieren" title="Gefilterte Liste als JSON exportieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11M12 3 8 7M12 3l4 4M5 12v7h14v-7"/></svg></button>
        </div>
      </div>
    </header>
    <!-- Row 2: filter section — search + shard/list toggle + collapsed tray.
         Sibling of the header, not a child: under shell-v2 the header band is
         exactly one header row high, so every grammar row owns its own track.
         data-pg-* attributes are wired by the shell grammar. -->
    <div class="ctox-filterbar" data-shell-v2-header-row="2">
      <input class="ctox-pane-search" type="search" data-pg-search placeholder="Suchen..." aria-label="Bugs und Features suchen" />
      <!-- ONE control, not two (Betreiber-Direktive 31.08.2026): the button is
           an ACTION that switches the view, so it carries no aria-pressed.
           `data-pg-view` stays on it as the shell grammar's state channel and
           always holds the CURRENT view; icon, aria-label and title announce
           the view it switches TO. -->
      <button type="button" class="ctox-pane-icon" data-reports-view-toggle data-pg-view="cards" aria-label="Als Liste anzeigen" title="Als Liste anzeigen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
      <button type="button" class="ctox-pane-icon ctox-filter-toggle" data-pg-tray-toggle aria-expanded="false" aria-label="Filter" title="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="var(--surface-2)"/><circle cx="15" cy="12" r="2.4" fill="var(--surface-2)"/><circle cx="8" cy="17" r="2.4" fill="var(--surface-2)"/></svg></button>
    </div>
    <div class="ctox-filter-tray" data-shell-v2-header-row="3" data-pg-tray hidden>
      <div class="ctox-filter-row">
        <select class="ctox-select" data-pg-filter data-pg-name="status" data-pg-default="all" aria-label="Status filtern">
          <option value="all">Alle Status</option>
          <option value="open">Offen</option>
          <option value="running">In Arbeit</option>
          <option value="completed">Erledigt</option>
          <option value="blocked">Blockiert</option>
        </select>
        <button type="button" class="ctox-sort-dir" data-pg-reset aria-label="Filter zurücksetzen" title="Filter zurücksetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7"/><path d="M4 5v5h5"/></svg></button>
      </div>
    </div>
    <!-- Row 4: counted view band (zeros filled by the module, zeros included). -->
    <nav class="ctox-view-switch" data-report-kind-chips aria-label="Typ Ansichten">
      <div class="ctox-pane-tabs">
        <button type="button" class="ctox-pane-tab is-active" role="tab" data-pg-band="all" aria-selected="true">Alle<span class="view-count" data-pg-count="all"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="bug" aria-selected="false">Bugs<span class="view-count" data-pg-count="bug"></span></button>
        <button type="button" class="ctox-pane-tab" role="tab" data-pg-band="feature" aria-selected="false">Features<span class="view-count" data-pg-count="feature"></span></button>
      </div>
    </nav>
    <div class="ctox-pane-body ctox-well">
      <div class="ctox-list" data-reports-list></div>
    </div>
    <footer class="ctox-pane-footer"><span data-pg-footer></span></footer>
  </aside>
  <button class="ctox-column-resizer" type="button" data-resizer="left" data-resizer-var="--ctox-left-width" data-resizer-min="260" data-resizer-max="500" aria-label="Spaltenbreite anpassen"></button>
  <section class="ctox-pane reports-detail" data-reports-detail aria-label="Report Details">
    <header class="ctox-pane-header ctox-pane-band" data-shell-v2-header-row="1">
      <div class="ctox-pane-title-row">
        <div class="ctox-pane-titles">
          <span class="ctox-pane-kicker" data-report-kind-label></span>
          <h2 class="ctox-pane-title" data-report-title>Eintrag auswählen</h2>
        </div>
        <!-- Detail head: exactly ONE filled action — the dominant flow for a
             selected report is the handover to the coding agent. The actions
             column is collapsed by default, so without this the module's main
             action had no head presence at all. The disclosure toggle beside
             it stays a plain icon (it is chrome, not a flow action). -->
        <div class="ctox-pane-actions">
          <button type="button" class="ctox-pane-icon is-primary reports-head-delegate" data-head-delegate title="An Coding Agent übergeben" aria-label="An Coding Agent übergeben" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h11"/><path d="M11 7l5 5-5 5"/><path d="M20 4v16"/></svg>
          </button>
          <button type="button" class="ctox-pane-icon reports-toggle-actions" data-toggle-actions title="Aktionen einblenden" aria-label="Aktionen einblenden" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="ctox-pane-scroll reports-detail-scroll" data-reports-detail-scroll></div>
    <footer class="ctox-pane-footer"><span data-pg-footer></span></footer>
  </section>
  <button class="ctox-column-resizer" type="button" data-resizer="right" data-resizer-var="--ctox-right-width" data-resizer-min="280" data-resizer-max="440" aria-label="Spaltenbreite anpassen"></button>
  <aside class="ctox-pane reports-actions" aria-label="Report Aktionen" data-reports-actions></aside>
</main>
