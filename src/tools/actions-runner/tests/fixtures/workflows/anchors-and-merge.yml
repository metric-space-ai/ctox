name: anchors
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env: &base
      CI: "true"
      SHARED: yes
    services:
      db:
        image: postgres:15
        env: *base
    steps:
      - uses: actions/checkout@v4
      - run: echo "$SHARED"
        env: *base
