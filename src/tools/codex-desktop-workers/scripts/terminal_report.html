<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR-Auswertung</title>
<style>
:root{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242a31;background:#f6f6f3;--border:#dfe2dc;--muted:#737b77;--accent:#27614b}
*{box-sizing:border-box}body{margin:0}main{max-width:1580px;margin:auto;padding:28px 32px}h1{font-size:28px;letter-spacing:-.7px;margin:0}h2{font-size:17px;margin:0;font-weight:650}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}button,select,input{font:inherit;color:inherit;background:white;border:1px solid #cbd0c8;border-radius:5px;padding:7px 10px}button{cursor:pointer}button:hover{background:#ecf2eb}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}label{font-size:12px;color:var(--muted);display:grid;gap:4px}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:22px}.filters label{flex:1;min-width:140px}.filters label.search{flex:2}.leaderboards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.box{background:white;border:1px solid var(--border);border-radius:9px;overflow:hidden}.boxhead{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{font-weight:550;text-align:left;color:var(--muted);border-bottom:1px solid var(--border);padding:10px 14px;white-space:nowrap}th button{border:0;border-radius:3px;background:transparent;color:inherit;padding:2px 0;font-weight:inherit;text-align:left}th button:hover{color:var(--accent);background:transparent}.sortmark{display:inline-block;min-width:12px;margin-left:4px;color:var(--accent)}td{padding:12px 14px;border-bottom:1px solid #eceee9;vertical-align:middle}tbody tr:last-child td{border-bottom:0}.number{font-variant-numeric:tabular-nums;white-space:nowrap}.scorebar{display:flex;align-items:center;gap:8px;min-width:108px;height:24px}.scorebar b{font-weight:600;min-width:26px;text-align:right}.track{width:72px;height:7px;background:#edf1ed;border-radius:9px;overflow:hidden}.fill{display:block;height:100%;background:#348269;border-radius:9px}.scorebar.low .fill{background:#ba7653}.scorebar.mid .fill{background:#a29c52}.empty{color:var(--muted);padding:22px}.pager{display:flex;gap:10px;align-items:center;font-size:12px;margin:16px 0 22px}.pager button:disabled{opacity:.35;cursor:default}.prtitle{max-width:360px;min-width:230px}.actors{min-width:200px;max-width:285px}.actor{display:flex;gap:8px}.actor+.actor{margin-top:4px}.actor span{color:var(--muted);width:14px;flex-shrink:0}.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 5px;border-radius:3px;background:#f0f1ec;color:#677169}.merged{background:#e9f1eb;color:#37644a}.closed{background:#f5ece7;color:#905b42}.advanced{display:none;gap:12px;flex-wrap:wrap;margin:-10px 0 20px}.advanced.open{display:flex}.advanced label{flex:1;min-width:130px}.chartbox{max-width:820px;margin:0 auto 22px}.charthead{padding-bottom:12px;flex-wrap:wrap}.modes{display:flex;gap:5px}.modes button{font-size:12px;padding:5px 10px}.modes button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}.chartlayout{padding:0 18px 16px}.chartlayout svg{display:block;width:100%;height:auto}.pair-controls{display:flex;gap:8px;align-items:center}.pair-controls select{font-size:12px;max-width:330px}.pair-controls input{width:28px;height:28px;padding:0;border:0;cursor:pointer}.plotlabel{font-size:12px;fill:#56635c}.tick{font-size:11px;fill:#758078}.grid{stroke:#edf0eb}.axis{stroke:#aab3ab}.plotpoint:hover{stroke:#242a31;stroke-width:2}.arrow{fill:none;stroke-width:2;opacity:.75}.unknown{color:var(--muted)}
@media(max-width:1000px){main{padding:22px 16px}.leaderboards{grid-template-columns:1fr}.pair-controls select{max-width:270px}.filters label{min-width:120px}.prtitle{min-width:180px}}@media print{button,.filters,.advanced,.pager,.pair-controls{display:none}.scroll{overflow:visible}main{padding:0}.leaderboards{grid-template-columns:1fr}}
</style></head>
<body><main>
<header><h1>PR-Auswertung</h1><button id="export">JSON herunterladen</button></header>
<div class="leaderboards"><section class="box"><div class="boxhead"><h2>Parents</h2></div><div class="scroll"><table id="parenttable"><thead><tr><th data-sort="label">Modell / Harness</th><th data-sort="prs">PRs</th><th data-sort="score">Score</th><th data-sort="rework">Ø Nacharbeiten</th></tr></thead><tbody id="parentboard"></tbody></table></div></section>
<section class="box"><div class="boxhead"><h2>Worker</h2></div><div class="scroll"><table id="workertable"><thead><tr><th data-sort="label">Modell / Harness</th><th data-sort="prs">PRs</th><th data-sort="first">Erstscore</th><th data-sort="end">Endscore</th><th data-sort="rework">Ø Nacharbeiten</th></tr></thead><tbody id="workerboard"></tbody></table></div></section></div>
<section class="box chartbox"><div class="boxhead charthead"><h2>Parent × Worker</h2><div class="modes"><button data-mode="first" aria-pressed="false">Erstscore</button><button data-mode="end" aria-pressed="false">Endscore</button><button data-mode="arrows" aria-pressed="true">Erst → End</button></div><div class="pair-controls"><select id="pair" aria-label="Parent / Worker"></select><input id="pair-color" type="color" aria-label="Farbe der Kombination"></div></div><div class="chartlayout"><svg id="scatter" viewBox="0 0 620 460" role="img" aria-label="Parent-Score auf der X-Achse, Worker-Score auf der Y-Achse"></svg></div></section>
<div class="box scroll"><table id="prtable"><thead><tr><th data-sort="pr">PR</th><th data-sort="status">Status</th><th data-sort="actors">Parent / Worker</th><th data-sort="parent">Parent Score</th><th data-sort="first">Worker Erst</th><th data-sort="end">Worker End</th><th data-sort="rework">Nacharbeiten</th></tr></thead><tbody id="prlist"></tbody></table></div>
<div class="pager"><button id="prev">← Zurück</button><span id="page"></span><button id="next">Weiter →</button><label><select id="size"><option value="25">25 PRs pro Seite</option><option value="50">50 PRs pro Seite</option><option value="100">100 PRs pro Seite</option></select></label></div>
</main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=v=>v==null?'—':Number(v).toFixed(1);
const harnessLabel=h=>['Codex Desktop','Codex'].includes(h)?'codex':['Claude Desktop','claude-desktop'].includes(h)?'claude':['native Grok Build CLI','Grok Build CLI'].includes(h)?'grok':h||'—';
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null,known=a=>a.filter(v=>v!=null);
const all=[...D.assessments.map(a=>({...a,rubric:a.schema})),...D.legacy];
const stageModel=(a,s)=>a[s]&&typeof a[s]==='object'?(Object.hasOwn(a[s],'model')?a[s].model:a[s].provenance?.model??a.model):Object.hasOwn(a,s+'_model')?a[s+'_model']:a.model;
const parentScore=a=>a.parent_completion?.weighted_total??null;
const actorModels=a=>[...new Set((a.role==='parent'&&parentScore(a)!=null?['parent_completion']:['first','corrected']).map(s=>stageModel(a,s)).filter(Boolean))];
const matchesModel=(a,m)=>!m||actorModels(a).includes(m)||(m==='unknown'&&actorModels(a).length===0);
const value=(a,s)=>a.rubric==='unified-actor-v1'?a[s]?.weighted_total??null:a[s]??null;
const scoreBar=v=>v==null?'<span class="unknown">—</span>':'<div class="scorebar '+(v<=4?'low':v<7?'mid':'')+'" aria-label="'+F(v)+' von 10"><b>'+F(v)+'</b><span class="track"><span class="fill" style="width:'+Math.max(0,Math.min(100,v*10))+'%"></span></span></div>';
const reworkIterations=(a,model=null)=>{
 const n=a.rework_iterations;if(!Number.isInteger(n)||n<0)return null;if(!model||n===0)return n;
 const corrections=(a.iteration_evidence||[]).filter(e=>e.kind==='correction');
 if(corrections.length===n&&corrections.every(e=>e.model))return corrections.filter(e=>e.model===model).length;
 const models=actorModels(a);return models.length===1&&models[0]===model?n:null;
};
let page=0,visible=[],actors=[],boards={parent:[],worker:[]},mode='arrows';
const sortState={parent:{key:'score',dir:-1},worker:{key:'end',dir:-1},pr:{key:'date',dir:-1}};
function compare(a,b,dir=1){
 if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;
 return dir*(typeof a==='number'&&typeof b==='number'?a-b:String(a).localeCompare(String(b),'de',{numeric:true,sensitivity:'base'}));
}
function sorted(rows,state,get=(r,k)=>r[k]){return rows.map((row,index)=>({row,index})).sort((a,b)=>compare(get(a.row,state.key),get(b.row,state.key),state.dir)||a.index-b.index).map(x=>x.row)}
function current(p,role,completionOnly=true){
 let a=all.filter(a=>a.pr_url===p.url&&a.role===role);
 const unified=new Set(a.filter(a=>a.rubric==='unified-actor-v1').map(a=>a.actor_id));
 a=a.filter(a=>a.rubric==='unified-actor-v1'||!unified.has(a.actor_id));
 const retro=new Set(a.filter(a=>a.rubric==='legacy-retrospective-v1').map(a=>a.actor_id));
 a=a.filter(a=>a.rubric!=='legacy-delivery-v1'||!retro.has(a.actor_id));
 const completed=role==='parent'&&completionOnly?a.filter(a=>parentScore(a)!=null):[];
 return completed.length?completed:a;
}
function reworkCount(p){
 if(Number.isInteger(p.rework_iterations)&&p.rework_iterations>=0)return p.rework_iterations;
 const rows=[...current(p,'parent',false),...current(p,'worker')];
 const whole=rows.filter(a=>a.iteration_scope==='pr'&&reworkIterations(a)!=null);
 if(whole.length&&new Set(whole.map(a=>a.rework_iterations)).size===1)return whole[0].rework_iterations;
 // Actor counts can overlap: an aggregate requires disjoint evidence or a PR-level count.
 const events=new Map();
 if(!rows.length||rows.some(a=>reworkIterations(a)==null)||!rows.some(a=>a.iteration_history_complete===true))return null;
 for(const a of rows){const n=reworkIterations(a),ee=(a.iteration_evidence||[]).filter(e=>e.kind==='correction');
 if(n===0)continue;if(ee.length!==n||ee.some(e=>!e.head))return null;
 for(const e of ee)events.set(e.head,e);}
 return events.size;
}
function prKey(p,k){
 if(k==='pr')return p.repository+' #'+p.number+' '+p.title;if(k==='status')return p.state;
 if(k==='date')return p.closedAt||p.mergedAt||'';if(k==='rework')return reworkCount(p);
 if(k==='actors')return ['parent','worker'].flatMap(r=>current(p,r).map(a=>(a.harness||'')+' / '+actorModels(a).join(' → '))).join(' ');
 const role=k==='parent'?'parent':'worker',aa=current(p,role).filter(a=>a.rubric==='unified-actor-v1');
 return avg(known(aa.map(a=>k==='parent'?parentScore(a):value(a,k==='first'?'first':'corrected'))));
}
function updateSortHeaders(){
 for(const name of ['parent','worker','pr'])document.querySelectorAll('#'+name+'table th[data-sort]').forEach(th=>{
 const active=sortState[name].key===th.dataset.sort;th.setAttribute('aria-sort',active?(sortState[name].dir===1?'ascending':'descending'):'none');
 th.querySelector('.sortmark').textContent=active?(sortState[name].dir===1?'↑':'↓'):'↕';
 });
}
function refresh(reset=true){
 if(reset)page=0;
 visible=[...D.prs];actors=D.assessments;
 for(const role of ['parent','worker']){
 const group=new Map(),seen=new Set();
 for(const a of actors.filter(a=>a.role===role)){
 const key=JSON.stringify([a.pr_url,a.actor_id,a.package||'delivery']);if(seen.has(key))continue;seen.add(key);
 const stages=role==='parent'?['parent_completion']:['first','corrected'];
 for(const model of new Set(stages.filter(s=>a[s]?.weighted_total!=null).map(s=>stageModel(a,s)).filter(Boolean))){
 const key=JSON.stringify([harnessLabel(a.harness),model]);if(!group.has(key))group.set(key,[]);group.get(key).push(a);
 }}
 boards[role]=[...group].map(([key,aa])=>{
 const [harness,model]=JSON.parse(key);
 if(role==='worker')aa=aa.filter(a=>['first','corrected'].every(s=>stageModel(a,s)===model&&a[s]?.weighted_total!=null));
 const ss=s=>known(aa.map(a=>stageModel(a,s)===model?a[s]?.weighted_total??null:null)),re=aa.map(a=>role==='parent'?reworkCount({url:a.pr_url}):reworkIterations(a,model));
 return {label:model+' (@'+harness+')',prs:new Set(aa.map(a=>a.pr_url)).size,score:avg(ss('parent_completion')),first:avg(ss('first')),end:avg(ss('corrected')),rework:re.length&&re.every(n=>n!=null)?re.reduce((sum,n)=>sum+n,0)/new Set(aa.map(a=>a.pr_url)).size:null};
 }).filter(g=>g.prs>0);
 }
 drawBoards();draw();drawChart();updateSortHeaders();
}
function drawBoards(){
 for(const role of ['parent','worker']){
 const rows=sorted(boards[role],sortState[role]);
 $(role+'board').innerHTML=rows.map(g=>'<tr><td>'+E(g.label)+'</td><td class="number">'+g.prs+'</td>'+
 (role==='parent'?'<td>'+scoreBar(g.score)+'</td>':'<td>'+scoreBar(g.first)+'</td><td>'+scoreBar(g.end)+'</td>')+
 '<td class="number">'+(g.rework==null?'—':F(g.rework))+'</td></tr>').join('')||'<tr><td colspan="'+(role==='parent'?4:5)+'" class="empty">—</td></tr>';
 }}
function actorCell(a,role){
 return '<div class="actor"><span>'+role+'</span><div>'+(!a.length?'—':a.map(x=>E(x.role==='parent'&&x.parent_completion?stageModel(x,'parent_completion')||'—':actorModels(x).join(' → ')||'—')+' (@'+E(harnessLabel(x.harness))+')').join('<br>'))+'</div></div>';
}
function scoreCell(a,stage){
 const rows=a.filter(x=>x.rubric==='unified-actor-v1');
 return rows.length?rows.map(x=>scoreBar(stage==='parent_completion'?parentScore(x):value(x,stage))).join(''):'—';
}
function draw(){
 visible=sorted(visible,sortState.pr,prKey);
 const size=Number($('size').value),pages=Math.max(1,Math.ceil(visible.length/size));page=Math.max(0,Math.min(page,pages-1));
 $('prlist').innerHTML=visible.slice(page*size,(page+1)*size).map(p=>{
 const parent=current(p,'parent'),worker=current(p,'worker');
 return '<tr><td class="prtitle"><a target="_blank" rel="noopener" href="'+E(p.url)+'"><strong>'+E(p.repository.split('/').pop())+' #'+p.number+'</strong> '+E(p.title)+'</a></td><td><span class="tag '+p.state.toLowerCase()+'">'+(p.state==='MERGED'?'gemergt'+(p.baseRefName?' → '+E(p.baseRefName):''):'geschlossen')+'</span>'+(p.stop?' <span class="tag">STOP</span>':'')+'</td><td class="actors">'+actorCell(parent,'P')+actorCell(worker,'W')+'</td><td>'+scoreCell(parent,'parent_completion')+'</td><td>'+scoreCell(worker,'first')+'</td><td>'+scoreCell(worker,'corrected')+'</td><td class="number">'+(reworkCount(p)??'—')+'</td></tr>';
 }).join('')||'<tr><td colspan="7" class="empty">Keine passenden PRs.</td></tr>';
 $('page').textContent='Seite '+(page+1)+' von '+pages+' · '+(visible.length?page*size+1:0)+'–'+Math.min((page+1)*size,visible.length)+' von '+visible.length;
 $('prev').disabled=page===0;$('next').disabled=page+1>=pages;
}
const palette=['#287c66','#d3843f','#576fb2','#ba5983','#8b7b3c','#5399a3','#8a60a1','#a5574f'],pairStyles=new Map();
function drawChart(){
 const pairs=D.parent_worker_pairs||[];
 const combinations=[...new Map(pairs.map(p=>[p.combination,p])).values()].sort((a,b)=>a.combination.localeCompare(b.combination));
 for(const p of combinations)if(!pairStyles.has(p.combination))pairStyles.set(p.combination,{color:palette[pairStyles.size%palette.length]});
 const selection=$('pair').value;
 $('pair').innerHTML='<option value="">Alle Kombinationen</option>'+combinations.map(p=>{
 const worker=[p.worker_first_model,p.worker_end_model].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' → ');
 const label=p.parent_model+' (@'+p.parent_harness+') × '+worker+' (@'+p.worker_harness+')';
 return '<option value="'+E(p.combination)+'">'+E(label)+'</option>';
 }).join('');
 $('pair').value=combinations.some(p=>p.combination===selection)?selection:'';
 $('pair').disabled=combinations.length===0;$('pair-color').disabled=!$('pair').value;
 $('pair-color').value=$('pair').value?pairStyles.get($('pair').value).color:'#999999';
 const X=v=>58+v*52,Y=v=>400-v*36,parts=[];
 for(let n=0;n<=10;n++)parts.push('<line class="grid" x1="'+X(n)+'" y1="40" x2="'+X(n)+'" y2="400"/><line class="grid" x1="58" y1="'+Y(n)+'" x2="578" y2="'+Y(n)+'"/><text class="tick" x="'+X(n)+'" y="420" text-anchor="middle">'+n+'</text><text class="tick" x="45" y="'+(Y(n)+4)+'" text-anchor="end">'+n+'</text>');
 parts.push('<path class="axis" fill="none" d="M58 40V400H578"/><text class="plotlabel" x="318" y="447" text-anchor="middle">Parent Score</text><text class="plotlabel" transform="translate(17 220) rotate(-90)" text-anchor="middle">Worker Score</text>');
 const shown=pairs.filter(p=>p.parent_score!=null);
 for(const p of shown){
 parts.push('<g opacity="'+(!$('pair').value||p.combination===$('pair').value?'1':'0.16')+'">');
 const c=pairStyles.get(p.combination).color,x=X(p.parent_score),title=E(p.repository+' #'+p.number+' · P '+F(p.parent_score)+' · W '+F(p.worker_first)+' → '+F(p.worker_end));
 const point=(v,hollow)=>'<circle class="plotpoint" cx="'+x+'" cy="'+Y(v)+'" r="4.5" fill="'+(hollow?'white':c)+'" stroke="'+c+'"><title>'+title+'</title></circle>';
 if(mode==='first'&&p.worker_first!=null)parts.push(point(p.worker_first,false));
 if(mode==='end'&&p.worker_end!=null)parts.push(point(p.worker_end,false));
 if(mode==='arrows'&&p.worker_first!=null&&p.worker_end!=null){
 const y0=Y(p.worker_first),y1=Y(p.worker_end);
 if(y0!==y1){const direction=Math.sign(y1-y0);parts.push('<path class="arrow" stroke="'+c+'" d="M'+x+' '+y0+'V'+y1+'M'+(x-4)+' '+(y1-direction*7)+'L'+x+' '+y1+'L'+(x+4)+' '+(y1-direction*7)+'"><title>'+title+'</title></path>')}
 parts.push(point(p.worker_first,true),point(p.worker_end,false));
 }
 parts.push('</g>');
 }
 $('scatter').innerHTML=parts.join('');
}
for(const name of ['parent','worker','pr'])document.querySelectorAll('#'+name+'table th[data-sort]').forEach(th=>{
 const text=th.textContent;th.innerHTML='<button type="button">'+E(text)+'<span class="sortmark" aria-hidden="true">↕</span></button>';
 th.querySelector('button').onclick=()=>{const state=sortState[name],key=th.dataset.sort;
 if(state.key===key)state.dir*=-1;else{state.key=key;state.dir=['label','pr','status','actors'].includes(key)?1:-1}
 if(name==='pr'){page=0;draw()}else drawBoards();updateSortHeaders();};
});
$('pair').onchange=()=>drawChart();$('pair-color').oninput=()=>{const selected=pairStyles.get($('pair').value);if(selected){selected.color=$('pair-color').value;drawChart()}};
document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{mode=e.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));drawChart()});
$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};$('size').onchange=()=>{page=0;draw()};
$('export').onclick=()=>{const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='MODEL-EXPERIENCE.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),0)};
refresh();
</script></body></html>
