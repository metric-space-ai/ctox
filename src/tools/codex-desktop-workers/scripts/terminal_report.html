<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR-Auswertung</title>
<style>
:root{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202c31;background:#f5f6f4;--border:#dfe5df;--muted:#6c7972;--accent:#245f4a}
*{box-sizing:border-box}body{margin:0}main{max-width:1580px;margin:auto;padding:28px 32px}h1{font-size:28px;letter-spacing:-.7px;margin:0}h2{font-size:17px;margin:0;font-weight:650}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.coverage{color:var(--muted);font-size:12px;margin:4px 0 0}button,select,input{font:inherit;color:inherit;background:white;border:1px solid #ccd5cd;border-radius:6px;padding:7px 10px}button{cursor:pointer}button:hover{background:#eef3ee}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.leaderboards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.box{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden}.boxhead{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{font-weight:550;text-align:left;color:var(--muted);border-bottom:1px solid var(--border);padding:10px 14px;white-space:nowrap}th button{border:0;background:transparent;color:inherit;padding:2px 0;font-weight:inherit;text-align:left}th button:hover{color:var(--accent);background:transparent}.sortmark{display:inline-block;min-width:12px;margin-left:4px;color:var(--accent)}td{padding:11px 14px;border-bottom:1px solid #edf0eb;vertical-align:middle}tbody tr:last-child td{border-bottom:0}.number{font-variant-numeric:tabular-nums;white-space:nowrap}.scorebar{display:flex;align-items:center;gap:8px;min-width:108px;height:24px}.scorebar b{font-weight:650;min-width:26px;text-align:right}.track{width:72px;height:7px;background:#edf1ed;border-radius:9px;overflow:hidden}.fill{display:block;height:100%;background:#348269;border-radius:9px}.scorebar.low .fill{background:#b97150}.scorebar.mid .fill{background:#a09844}.empty{color:var(--muted);padding:22px}.pager{display:flex;gap:10px;align-items:center;font-size:12px;margin:14px 0 22px}.pager button:disabled{opacity:.35;cursor:default}.prtitle{max-width:390px;min-width:230px}.actors{min-width:200px;max-width:280px}.actor{display:flex;gap:8px}.actor+.actor{margin-top:4px}.actor span{color:var(--muted);width:14px;flex-shrink:0}.tag{display:inline-block;font-size:10px;font-weight:650;padding:2px 5px;border-radius:4px;background:#f0f2ec;color:#677169}.merged{background:#e8f1ea;color:#35654b}.closed{background:#f5ebe5;color:#905b42}.review-pending{color:#8c6847;font-size:12px}.plots{margin-bottom:18px}.distributions{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:16px 20px 12px}.plot-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;gap:12px}.plot-title span{color:var(--muted);font-weight:400;font-size:12px}.histogram{width:100%;height:175px;display:block}.legend{display:flex;gap:12px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:2px;background:#287c66}.legend .initial{background:#a0bdb0}.scatter-section{border-top:1px solid var(--border)}.charthead{padding:14px 20px 4px;flex-wrap:wrap}.modes{display:flex;gap:4px}.modes button{font-size:12px;padding:5px 9px}.modes button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}.chartlayout{padding:2px 18px 12px}.chartlayout svg{display:block;width:100%;height:300px}.pair-controls{display:flex;gap:8px;align-items:center}.pair-controls select{font-size:12px;max-width:380px}.pair-controls input{width:24px;height:24px;padding:0;border:0;cursor:pointer}.plotlabel{font-size:12px;fill:#59695f}.tick{font-size:11px;fill:#738176}.grid{stroke:#edf1ec}.axis{stroke:#a9b6ac}.plotpoint:hover{stroke:#202c31;stroke-width:2}.arrow{fill:none;stroke-width:1.5;opacity:.6;pointer-events:none}.chart-count{font-size:12px;color:var(--muted);font-weight:400}.unknown{color:var(--muted)}
@media(max-width:1000px){main{padding:22px 16px}.leaderboards{grid-template-columns:1fr}.pair-controls select{max-width:300px}.prtitle{min-width:180px}}@media(max-width:650px){.distributions{grid-template-columns:1fr}.chartlayout svg{height:280px}.pair-controls{width:100%}.pair-controls select{max-width:none;width:100%}.charthead{gap:10px}.pager{flex-wrap:wrap}}@media print{button,.pager,.pair-controls{display:none}.scroll{overflow:visible}main{padding:0}.leaderboards{grid-template-columns:1fr}}
</style></head>
<body><main>
<header><div><h1>PR-Auswertung</h1><p id="coverage" class="coverage"></p></div><button id="export">JSON herunterladen</button></header>
<div class="leaderboards"><section class="box"><div class="boxhead"><h2>Parents</h2></div><div class="scroll"><table id="parenttable"><thead><tr><th data-sort="label">Modell / Harness</th><th data-sort="prs">PRs</th><th data-sort="score">Score</th><th data-sort="rework">Ø Nacharbeiten</th></tr></thead><tbody id="parentboard"></tbody></table></div></section>
<section class="box"><div class="boxhead"><h2>Worker</h2></div><div class="scroll"><table id="workertable"><thead><tr><th data-sort="label">Modell / Harness</th><th data-sort="prs">PRs</th><th data-sort="first">Erstscore</th><th data-sort="end">Endscore</th><th data-sort="rework">Ø Nacharbeiten</th></tr></thead><tbody id="workerboard"></tbody></table></div></section></div>
<section class="box plots">
<div class="distributions"><div><div class="plot-title">Parent-Scores <span id="parent-count"></span></div><svg id="parent-distribution" class="histogram" viewBox="0 0 600 170" role="img" aria-label="Verteilung aller belegten Parent-Abschlussnoten"></svg></div><div><div class="plot-title">Worker-Scores <span class="legend"><span><i class="initial"></i>Erst</span><span><i></i>End</span></span></div><svg id="worker-distribution" class="histogram" viewBox="0 0 600 170" role="img" aria-label="Verteilung aller belegten Worker-Erstnoten und Endnoten"></svg></div></div>
<div class="scatter-section"><div class="boxhead charthead"><h2>Parent × Worker <span id="chart-count" class="chart-count"></span></h2><div class="modes"><button data-mode="first" aria-pressed="false">Erstscore</button><button data-mode="end" aria-pressed="true">Endscore</button><button data-mode="arrows" aria-pressed="false">Erst → End</button></div><div class="pair-controls"><select id="pair" aria-label="Nur diese Modellkombination anzeigen"></select><input id="pair-color" type="color" aria-label="Farbe der gewählten Kombination"></div></div><div class="chartlayout"><svg id="scatter" viewBox="0 0 930 300" role="img" aria-label="Echte Parent-Worker-Paare: Parent-Score horizontal, Worker-Score vertikal"></svg></div></div></section>
<div class="box scroll"><table id="prtable"><thead><tr><th data-sort="pr">PR</th><th data-sort="status">Status</th><th data-sort="actors">Parent / Worker</th><th data-sort="parent">Parent Score</th><th data-sort="first">Worker Erst</th><th data-sort="end">Worker End</th><th data-sort="rework">Nacharbeiten</th></tr></thead><tbody id="prlist"></tbody></table></div>
<div class="pager"><button id="prev">← Zurück</button><span id="page"></span><button id="next">Weiter →</button><label><select id="size"><option value="25">25 PRs pro Seite</option><option value="50">50 PRs pro Seite</option><option value="100">100 PRs pro Seite</option></select></label></div>
</main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=v=>v==null?'—':Number(v).toFixed(1);
const harnessLabel=h=>['Codex Desktop','Codex','codex_exec'].includes(h)?'codex':['Claude Desktop','claude-desktop','Claude Code'].includes(h)?'claude':['native Grok Build CLI','Grok Build CLI'].includes(h)?'grok':h||'—';
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null,known=a=>a.filter(v=>v!=null);
const all=[...D.assessments.map(a=>({...a,rubric:a.schema})),...D.legacy];
const stageModel=(a,s)=>a[s]&&typeof a[s]==='object'?(Object.hasOwn(a[s],'model')?a[s].model:a[s].provenance?.model??a.model):Object.hasOwn(a,s+'_model')?a[s+'_model']:a.model;
const parentScore=a=>a.parent_completion?.weighted_total??null;
const actorModels=a=>[...new Set((a.role==='parent'&&parentScore(a)!=null?['parent_completion']:['first','corrected']).map(s=>stageModel(a,s)).filter(Boolean))];
const matchesModel=(a,m)=>!m||actorModels(a).includes(m)||(m==='unknown'&&actorModels(a).length===0);
const value=(a,s)=>(a.rubric||a.schema)==='unified-actor-v1'?a[s]?.weighted_total??null:a[s]??null;
const scoreBar=v=>v==null?'<span class="unknown">—</span>':'<div class="scorebar '+(v<=4?'low':v<7?'mid':'')+'" aria-label="'+F(v)+' von 10"><b>'+F(v)+'</b><span class="track"><span class="fill" style="width:'+Math.max(0,Math.min(100,v*10))+'%"></span></span></div>';
const reworkIterations=(a,model=null)=>{
 const n=a.rework_iterations;if(!Number.isInteger(n)||n<0)return null;if(!model||n===0)return n;
 const corrections=(a.iteration_evidence||[]).filter(e=>e.kind==='correction');
 if(corrections.length===n&&corrections.every(e=>e.model))return corrections.filter(e=>e.model===model).length;
 const models=actorModels(a);return models.length===1&&models[0]===model?n:null;
};
let page=0,visible=[],actors=[],boards={parent:[],worker:[]},mode='end';
const sortState={parent:{key:'score',dir:-1},worker:{key:'end',dir:-1},pr:{key:'date',dir:-1}};
function compare(a,b,dir=1){
 if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;
 return dir*(typeof a==='number'&&typeof b==='number'?a-b:String(a).localeCompare(String(b),'de',{numeric:true,sensitivity:'base'}));
}
function sorted(rows,state,get=(r,k)=>r[k]){return rows.map((row,index)=>({row,index})).sort((a,b)=>compare(get(a.row,state.key),get(b.row,state.key),state.dir)||a.index-b.index).map(x=>x.row)}
function current(p,role,completionOnly=true){
 let a=all.filter(a=>a.pr_url===p.url&&a.role===role);
 const unified=new Set(a.filter(a=>a.rubric==='unified-actor-v1').map(a=>a.actor_id));
 a=a.filter(a=>a.rubric==='unified-actor-v1'||!unified.has(a.actor_id));
 const retro=new Set(a.filter(a=>a.rubric==='legacy-retrospective-v1').map(a=>a.actor_id));
 a=a.filter(a=>a.rubric!=='legacy-delivery-v1'||!retro.has(a.actor_id));
 const completed=role==='parent'&&completionOnly?a.filter(a=>parentScore(a)!=null):[];
 if(completed.length)return completed;
 if(role==='parent'&&completionOnly&&p.closing_review?.model)
 return [{...p.closing_review,role:'parent'}];
 return a;
}
function reworkCount(p){
 if(Number.isInteger(p.rework_iterations)&&p.rework_iterations>=0)return p.rework_iterations;
 const rows=[...current(p,'parent',false),...current(p,'worker')];
 const whole=rows.filter(a=>a.iteration_scope==='pr'&&reworkIterations(a)!=null);
 if(whole.length&&new Set(whole.map(a=>a.rework_iterations)).size===1)return whole[0].rework_iterations;
 // Actor counts can overlap: an aggregate requires disjoint evidence or a PR-level count.
 const events=new Map();
 if(!rows.length||rows.some(a=>reworkIterations(a)==null)||!rows.some(a=>a.iteration_history_complete===true))return null;
 for(const a of rows){const n=reworkIterations(a),ee=(a.iteration_evidence||[]).filter(e=>e.kind==='correction');
 if(n===0)continue;if(ee.length!==n||ee.some(e=>!e.head))return null;
 for(const e of ee)events.set(e.head,e);}
 return events.size;
}
function reworkLowerBound(p){
 const rows=[p,...current(p,'parent',false),...current(p,'worker')];
 const bounds=rows.map(a=>a.whole_pr_rework_iterations_lower_bound).filter(n=>Number.isInteger(n)&&n>0);
 return bounds.length?Math.max(...bounds):null;
}
function reworkDisplay(p){
 const exact=reworkCount(p),lower=reworkLowerBound(p);
 return exact!=null?String(exact):lower!=null?'≥'+lower:'—';
}
function prKey(p,k){
 if(k==='pr')return p.repository+' #'+p.number+' '+p.title;if(k==='status')return p.state;
 if(k==='date')return p.closedAt||p.mergedAt||'';if(k==='rework')return reworkCount(p)??reworkLowerBound(p);
 if(k==='actors')return ['parent','worker'].flatMap(r=>current(p,r).map(a=>(a.harness||'')+' / '+actorModels(a).join(' → '))).join(' ');
 const role=k==='parent'?'parent':'worker',aa=current(p,role).filter(a=>a.rubric==='unified-actor-v1');
 return avg(known(aa.map(a=>k==='parent'?parentScore(a):value(a,k==='first'?'first':'corrected'))));
}
function updateSortHeaders(){
 for(const name of ['parent','worker','pr'])document.querySelectorAll('#'+name+'table th[data-sort]').forEach(th=>{
 const active=sortState[name].key===th.dataset.sort;th.setAttribute('aria-sort',active?(sortState[name].dir===1?'ascending':'descending'):'none');
 th.querySelector('.sortmark').textContent=active?(sortState[name].dir===1?'↑':'↓'):'↕';
 });
}
function refresh(reset=true){
 if(reset)page=0;
 visible=[...D.prs];actors=D.assessments;
 const c=D.coverage;
 if(c)$('coverage').textContent=c.terminal_prs+' PRs · '+c.scored_prs+' mit Scores · '+c.pending_prs+' Prüfungen offen · '+c.stopped_prs+' STOP';
 for(const role of ['parent','worker']){
 boards[role]=(D.leaderboards||[]).filter(g=>g.role===role&&g.rubric==='unified-actor-v1'&&g.model&&(g.observed_prs??g.prs)>0).map(g=>{
  const rw=g.observed_rework;
  return {label:g.model+' (@'+harnessLabel(g.harness)+')',prs:g.observed_prs??g.prs,score:g.score.mean,
   first:(g.observed_first||g.first).mean,end:(g.observed_corrected||g.corrected).mean,
   firstN:(g.observed_first||g.first).n,endN:(g.observed_corrected||g.corrected).n,
   scoreN:g.score.n,rework:rw?(rw.n===rw.denominator?rw.mean:null):g.rework.mean,
   reworkN:rw?.n??g.rework.known,reworkTotal:rw?.denominator??g.deliveries};
 });
 }
 drawBoards();draw();drawDistributions();drawChart();updateSortHeaders();
}
function drawBoards(){
 for(const role of ['parent','worker']){
 const rows=sorted(boards[role],sortState[role]);
 $(role+'board').innerHTML=rows.map(g=>'<tr><td>'+E(g.label)+'</td><td class="number">'+g.prs+'</td>'+
 (role==='parent'?'<td title="'+g.scoreN+' Abschlussnoten">'+scoreBar(g.score)+'</td>':'<td title="'+g.firstN+' Erstnoten">'+scoreBar(g.first)+'</td><td title="'+g.endN+' Endnoten">'+scoreBar(g.end)+'</td>')+
 '<td class="number" title="'+g.reworkN+' von '+g.reworkTotal+' Iterationszählungen vollständig belegt">'+(g.rework==null?'—':F(g.rework))+'</td></tr>').join('')||'<tr><td colspan="'+(role==='parent'?4:5)+'" class="empty">Keine belegten Scores.</td></tr>';
 }}
function actorCell(a,role){
 return '<div class="actor"><span>'+role+'</span><div>'+(!a.length?'—':a.map(x=>E(x.role==='parent'&&x.parent_completion?stageModel(x,'parent_completion')||'—':actorModels(x).join(' → ')||'—')+' (@'+E(harnessLabel(x.harness))+')').join('<br>'))+'</div></div>';
}
function scoreCell(a,stage){
 const rows=a.filter(x=>x.rubric==='unified-actor-v1');
 return rows.length?rows.map(x=>scoreBar(stage==='parent_completion'?parentScore(x):value(x,stage))).join(''):'—';
}
function mergeTarget(p){return p.merge_target?.branch||p.baseRefName||"";}
function draw(){
 visible=sorted(visible,sortState.pr,prKey);
 const size=Number($('size').value),pages=Math.max(1,Math.ceil(visible.length/size));page=Math.max(0,Math.min(page,pages-1));
 $('prlist').innerHTML=visible.slice(page*size,(page+1)*size).map(p=>{
 const parent=current(p,'parent'),worker=current(p,'worker');
 const hasScore=[...parent,...worker].some(a=>a.rubric==='unified-actor-v1'&&['parent_completion','first','corrected'].some(s=>value(a,s)!=null));
 const actors=[parent.length?actorCell(parent,'P'):'',worker.length?actorCell(worker,'W'):''].join('');
 const scores=!hasScore?'<td colspan="5" class="review-pending" title="'+E(p.coverage_reason)+'">'+(p.stop?'Prüfung gestoppt':'Prüfung offen')+'</td>':
 '<td class="actors">'+actors+'</td><td>'+scoreCell(parent,'parent_completion')+'</td>'+
 (worker.some(a=>a.rubric==='unified-actor-v1'&&(value(a,'first')!=null||value(a,'corrected')!=null))?'<td>'+scoreCell(worker,'first')+'</td><td>'+scoreCell(worker,'corrected')+'</td>':'<td colspan="2" class="unknown">Kein Worker-Score belegt</td>')+
 '<td class="number" title="'+(reworkCount(p)==null?'Vollständige Zählung noch offen':'Belegte korrektive Push-Pakete bis Merge oder Close')+'">'+reworkDisplay(p)+'</td>';
 return '<tr data-pr="'+E(p.url)+'"><td class="prtitle"><a target="_blank" rel="noopener" href="'+E(p.url)+'"><strong>'+E(p.repository.split('/').pop())+' #'+p.number+'</strong> '+E(p.title)+'</a></td><td><span class="tag '+p.state.toLowerCase()+'">'+(p.state==='MERGED'?'gemergt'+(mergeTarget(p)?' → '+E(mergeTarget(p)):''):'geschlossen')+'</span>'+(p.stop?' <span class="tag">STOP</span>':'')+'</td>'+scores+'</tr>';
 }).join('')||'<tr><td colspan="7" class="empty">Keine passenden PRs.</td></tr>';
 $('page').textContent='Seite '+(page+1)+' von '+pages+' · '+(visible.length?page*size+1:0)+'–'+Math.min((page+1)*size,visible.length)+' von '+visible.length;
 $('prev').disabled=page===0;$('next').disabled=page+1>=pages;
}
const palette=['#287c66','#cb8241','#5975b6','#b85c89','#8c7c37','#52979d','#8b62a0','#a65950'],pairStyles=new Map();
function drawDistributions(){
 const parents=actors.filter(a=>a.role==='parent').map(parentScore).filter(v=>v!=null);
 const workers=actors.filter(a=>a.role==='worker'),first=known(workers.map(a=>value(a,'first'))),end=known(workers.map(a=>value(a,'corrected')));
 $('parent-count').textContent=parents.length+' Scores';
 const histogram=(id,series)=>{
  const bins=series.map(s=>Array.from({length:10},(_,i)=>s.values.filter(v=>v>=i&&(v<i+1||i===9&&v===10)).length));
  const max=Math.max(1,...bins.flat()),parts=[],X=v=>40+v*54,Y=v=>134-v/max*103;
  for(let n=0;n<=2;n++){const y=Y(max*n/2);parts.push('<line class="grid" x1="40" y1="'+y+'" x2="580" y2="'+y+'"/><text class="tick" x="31" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*n/2)+'</text>')}
  for(let i=0;i<10;i++)for(let j=0;j<series.length;j++){
   const count=bins[j][i],width=series.length===1?44:21,x=X(i)+5+j*23;
   parts.push('<rect data-bin="'+i+'" data-series="'+series[j].name+'" data-count="'+count+'" x="'+x+'" y="'+Y(count)+'" width="'+width+'" height="'+(134-Y(count))+'" rx="2" fill="'+series[j].color+'"><title>'+series[j].name+' · '+i+'–'+(i+1)+' Punkte · '+count+' Scores</title></rect>');
  }
  for(let i=0;i<=10;i++)parts.push('<text class="tick" x="'+X(i)+'" y="154" text-anchor="middle">'+i+'</text>');
  parts.push('<path class="axis" fill="none" d="M40 28V134H580"/>');
  $(id).innerHTML=parts.join('');$(id).dataset.total=series.reduce((n,s)=>n+s.values.length,0);
  $(id).setAttribute('aria-label',series.map(s=>s.name+': '+s.values.length+' Scores').join('; ')+'. X: Score 0 bis 10; Y: Anzahl Scores.');
 };
 histogram('parent-distribution',[{name:'Parent',values:parents,color:'#287c66'}]);
 histogram('worker-distribution',[{name:'Erst',values:first,color:'#a0bdb0'},{name:'End',values:end,color:'#287c66'}]);
}
const pairKey=p=>JSON.stringify([harnessLabel(p.parent_harness),p.parent_model,harnessLabel(p.worker_harness),[...new Set([p.worker_first_model,p.worker_end_model].filter(Boolean))]]);
function drawChart(){
 const pairs=(D.parent_worker_pairs||[]).map(p=>({...p,combination:pairKey(p)}));
 const combinations=[...new Map(pairs.map(p=>[p.combination,p])).values()].sort((a,b)=>a.combination.localeCompare(b.combination));
 for(const p of combinations)if(!pairStyles.has(p.combination))pairStyles.set(p.combination,{color:palette[pairStyles.size%palette.length]});
 const selection=$('pair').value;
 $('pair').innerHTML='<option value="">Alle Modellkombinationen</option>'+combinations.map(p=>{
 const worker=[...new Set([p.worker_first_model,p.worker_end_model].filter(Boolean))].join(' → ');
 return '<option value="'+E(p.combination)+'">'+E(p.parent_model+' (@'+harnessLabel(p.parent_harness)+') × '+worker+' (@'+harnessLabel(p.worker_harness)+')')+'</option>';
 }).join('');
 $('pair').value=combinations.some(p=>p.combination===selection)?selection:'';
 $('pair').disabled=!combinations.length;$('pair-color').disabled=!$('pair').value;
 $('pair-color').value=$('pair').value?pairStyles.get($('pair').value).color:'#999999';
 const selected=pairs.filter(p=>!$('pair').value||p.combination===$('pair').value);
 const shown=selected.filter(p=>mode==='arrows'?p.first_end_scope_comparable!==false&&p.worker_first!=null&&p.worker_end!=null:p['worker_'+mode]!=null);
 const parts=[],X=v=>65+v*83,Y=v=>246-v*20.6;
 for(let n=0;n<=10;n++){
  parts.push('<line class="grid" x1="'+X(n)+'" y1="40" x2="'+X(n)+'" y2="246"/><text class="tick" x="'+X(n)+'" y="266" text-anchor="middle">'+n+'</text>');
  if(n%2===0)parts.push('<line class="grid" x1="65" y1="'+Y(n)+'" x2="895" y2="'+Y(n)+'"/><text class="tick" x="52" y="'+(Y(n)+4)+'" text-anchor="end">'+n+'</text>');
 }
 parts.push('<path class="axis" fill="none" d="M65 40V246H895"/><text class="plotlabel" x="480" y="291" text-anchor="middle">Parent-Score</text><text class="plotlabel" transform="translate(17 145) rotate(-90)" text-anchor="middle">Worker-Score</text>');
 const locations=new Map(),point=(p,stage,color,hollow)=>{
  const score=p['worker_'+stage],x=X(p.parent_score),y=Y(score),key=x+':'+y,ordinal=locations.get(key)||0;
  locations.set(key,ordinal+1);
  const angle=ordinal*2.39996323,r=ordinal?Math.min(10,2.3*Math.sqrt(ordinal)):0,cx=x+Math.cos(angle)*r,cy=y+Math.sin(angle)*r;
  parts.push('<a href="'+E(p.pr_url)+'" target="_blank" rel="noopener"><circle class="plotpoint" data-pr="'+E(p.pr_url)+'" data-stage="'+stage+'" data-score="'+score+'" data-parent="'+p.parent_score+'" cx="'+cx+'" cy="'+cy+'" r="3.2" fill="'+(hollow?'white':color)+'" stroke="'+color+'" opacity=".8"><title>'+E(p.repository+' #'+p.number+' · Parent '+F(p.parent_score)+' · Worker '+(stage==='first'?'Erst ':'End ')+F(score))+'</title></circle></a>');
 };
 for(const p of shown){
  const color=pairStyles.get(p.combination).color;
  if(mode==='arrows'&&p.worker_first!==p.worker_end){
   const x=X(p.parent_score),y1=Y(p.worker_first),y2=Y(p.worker_end),direction=Math.sign(y2-y1);
   parts.push('<path class="arrow" stroke="'+color+'" d="M'+x+' '+y1+'V'+y2+'M'+(x-3)+' '+(y2-direction*6)+'L'+x+' '+y2+'L'+(x+3)+' '+(y2-direction*6)+'"/>');
  }
  if(mode==='arrows'){point(p,'first',color,true);point(p,'end',color,false)}else point(p,mode,color,false);
 }
 if(!shown.length)parts.push('<text class="plotlabel" x="480" y="135" text-anchor="middle">Keine belegten Paare für diese Auswahl</text>');
 $('chart-count').textContent=shown.length+' belegte Paare';
 $('scatter').dataset.pairs=shown.length;
 $('scatter').innerHTML=parts.join('');
}

for(const name of ['parent','worker','pr'])document.querySelectorAll('#'+name+'table th[data-sort]').forEach(th=>{
 const text=th.textContent;th.innerHTML='<button type="button">'+E(text)+'<span class="sortmark" aria-hidden="true">↕</span></button>';
 th.querySelector('button').onclick=()=>{const state=sortState[name],key=th.dataset.sort;
 if(state.key===key)state.dir*=-1;else{state.key=key;state.dir=['label','pr','status','actors'].includes(key)?1:-1}
 if(name==='pr'){page=0;draw()}else drawBoards();updateSortHeaders();};
});
$('pair').onchange=()=>drawChart();$('pair-color').oninput=()=>{const selected=pairStyles.get($('pair').value);if(selected){selected.color=$('pair-color').value;drawChart()}};
document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{mode=e.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));drawChart()});
$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};$('size').onchange=()=>{page=0;draw()};
$('export').onclick=()=>{const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='MODEL-EXPERIENCE.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),0)};
refresh();
</script></body></html>
