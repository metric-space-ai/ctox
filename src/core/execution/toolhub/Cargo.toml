[package]
name = "ctox-toolhub"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "CTOX service adapters (toolkits, managed OAuth, connected accounts); Composio-aligned concepts"

[features]
default = ["ureq-transport"]
ureq-transport = ["dep:ureq"]

[dependencies]
anyhow = "1"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
ureq = { version = "2.12", features = ["tls", "json"], optional = true }

[dev-dependencies]
