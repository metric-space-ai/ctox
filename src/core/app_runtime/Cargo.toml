[package]
name = "ctox-app-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
path = "lib.rs"

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security"] }
