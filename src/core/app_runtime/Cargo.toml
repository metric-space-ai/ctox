[package]
name = "ctox-app-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "AGPL-3.0-only"

[lib]
path = "lib.rs"

[workspace]

[features]
default = ["core-store"]
core-store = ["dep:ctox-store", "dep:ctox-app-capabilities-contract", "dep:rusqlite", "dep:tokio"]
bundled-node = []
legacy-store = ["dep:rxdb", "dep:tokio"]

[dependencies]
ctox-store = { path = "../store", optional = true }
ctox-app-capabilities-contract = { path = "../app_capabilities/contract", optional = true }
rusqlite = { version = "0.32", optional = true }
rxdb = { package = "ctox-rxdb", path = "../rxdb", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"


# Match the Core host patch; dependency patches are not inherited by Cargo.
[patch.crates-io]
rtc-ice = { path = "../rxdb/patches/rtc-ice" }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security"] }
