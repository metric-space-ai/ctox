[package]
name = "ctox-voxtral-4b-tts-2603"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Native CPU/CUDA text-to-WAV graph for engineai/Voxtral-4B-TTS-2603."
build = "build.rs"

[workspace]

[lib]
name = "ctox_voxtral_4b_tts_2603"
path = "src/lib.rs"

[[bin]]
name = "ctox-voxtral-tts-inspect"
path = "src/main.rs"

[[bin]]
name = "ctox-voxtral-tts-synthesize"
path = "src/synthesize.rs"

[features]
default = []
cuda = []
metal = []
wgsl = []

[dependencies]
