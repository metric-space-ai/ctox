[package]
name = "ctox-store"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
path = "lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
