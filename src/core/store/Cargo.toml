[package]
name = "ctox-store"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
path = "lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
