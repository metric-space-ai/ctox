[package]
name = "ctox-sync"
version = "0.1.0"
edition = "2021"
publish = false
description = "CTOX Sync execution authority, portable checkpoints and local IPC contracts"

[[example]]
name = "host_cli_acceptance"
required-features = ["webrtc"]
[features]
webrtc = ["dep:rxdb", "dep:futures-util", "dep:url"]

[dependencies]
futures-util = { version = "0.3", optional = true }
url = { version = "2.5", optional = true }
rxdb = { package = "ctox-rxdb", path = "../rxdb", optional = true }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
ring = "0.17"
thiserror = "2"
async-trait = "0.1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
fs2 = "=0.4.3"
libc = "0.2"
socket2 = "0.6"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["test-util"] }
futures = "0.3"
tokio-tungstenite = "0.28"

# Cargo ignores dependency patches; standalone tests must mirror the host.
[patch.crates-io]
rtc-ice = { path = "../rxdb/patches/rtc-ice" }
