[package]
name = "aria2-rust"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Clean-room reimplementation of aria2 in safe Rust (no unsafe in this crate)"
rust-version = "1.85"
default-run = "aria2c"

[[bin]]
name = "aria2c"
path = "src/bin/aria2c.rs"


[[test]]
name = "sftp_download"
required-features = ["sftp"]
[lib]
name = "aria2_rust"
path = "src/lib.rs"

[features]
default = ["sftp"]
sftp = ["dep:russh", "dep:russh-sftp"]

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
flate2 = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "deflate", "http2"] }
russh = { version = "0.63", default-features = false, features = ["ring"], optional = true }
russh-sftp = { version = "2.4", optional = true }
rustix = { version = "1.1.4", features = ["net", "process", "fs"] }
rustls = { version = "0.23.44", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
sha1 = { version = "0.10", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
num-bigint = "0.4"
md-5 = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
