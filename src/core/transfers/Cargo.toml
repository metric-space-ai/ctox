[package]
name = "ctox-transfers"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
aria2-rust = { path = "aria2-rust", default-features = false }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"

tempfile = "3"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=2.1.1"
# SSPI 0.23 does not handle the enum variant added by picky-krb 0.12.5.
picky-krb = "=0.12.4"
smb = { path = "vendor/smb", default-features = false, features = ["single_threaded", "sign", "encrypt"] }


[dev-dependencies]
