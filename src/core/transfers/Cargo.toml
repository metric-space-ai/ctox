[package]
name = "ctox-transfers"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
aria2-rust = { git = "https://github.com/mkh-welsch/aria2-rust", rev = "8364bcd7902dbd853a0f746c3dc937bbaadec561", default-features = false }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"

[dev-dependencies]
tempfile = "3"
